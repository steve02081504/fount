name: Set Executable Permissions

permissions:
  contents: write

on:
  push:
    paths:
      - '**.sh'
      - '**.fish'
      - '**.zsh'
      - '**.ps1'
      - '**.bat'
      - 'path/**'
      - 'gradlew'
      - 'gradlew.bat'
    tags-ignore:
      - '*'
    branches:
      - '*'
  workflow_dispatch:

jobs:
  set-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set execute permission for sh files
        run: |
          find . -type f \( -name "*.sh" -o -name "*.ps1" -o -name "*.fish" -o -name "*.zsh" -o -name "*.bat" \) -print0 | xargs -0 chmod +x
          find ./path -type f ! -name 'desktop.ini' ! -iname 'agents.md' -print0 | xargs -0 chmod +x
          chmod -x ./path/desktop.ini
          for f in ./path/AGENTS.md ./path/agents.md; do
            [ -f "$f" ] && chmod -x "$f"
          done
          chmod +x ./gradlew
          chmod +x ./gradlew.bat
      - name: git add all
        run: git add -A
      - name: Push changes
        uses: actions-go/push@master
        with:
          author-email: taromati2@outlook.com
          author-name: Taromati2
          commit-message: 'file update~'
          remote: origin
          token: ${{ secrets.GITHUB_TOKEN }}
