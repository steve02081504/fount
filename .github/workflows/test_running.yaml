name: Test Running

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/runner/**'
      - 'path/**'
      - 'path/CI/**'
      - '.github/workflows/test_running.yaml'
    tags-ignore:
      - '*'
    branches:
      - '*'

permissions:
  contents: read

jobs:
  test-fount:
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Extract branch name
        shell: bash
        run: |
          touch .nodelete
          echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: test script (bash)
        shell: bash
        env:
          FOUNT_BRANCH: ${{ steps.extract_branch.outputs.branch }}
        run: |
          export FOUNT_DIR="$PWD/fount"
          export FOUNT_ACCEPT_EULA=1
          curl -fsSL "https://raw.githubusercontent.com/steve02081504/fount/refs/heads/${FOUNT_BRANCH}/src/runner/main.sh" | bash -s -- init
          ci=$(mktemp -d)
          cp -R "$FOUNT_DIR/path/CI/." "$ci/"
          bash "$ci/run-remove-assert.sh" "$FOUNT_DIR/path/fount.sh"

      - name: test script (pwsh)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          FOUNT_BRANCH: ${{ steps.extract_branch.outputs.branch }}
        run: |
          $env:FOUNT_DIR = "$PWD/fount"
          $env:FOUNT_ACCEPT_EULA = '1'
          $scriptContent = Invoke-RestMethod "https://raw.githubusercontent.com/steve02081504/fount/refs/heads/$($env:FOUNT_BRANCH)/src/runner/main.ps1"
          Invoke-Expression "function fountInstaller { $scriptContent }"
          fountInstaller init
          $ci = Join-Path $env:TEMP "fount-remove-assert-$PID"
          New-Item -ItemType Directory -Path $ci | Out-Null
          Copy-Item -Recurse -Force "$env:FOUNT_DIR\path\CI\*" $ci
          & (Join-Path $ci 'run-remove-assert.ps1') -Fount (Join-Path $env:FOUNT_DIR 'path\fount.ps1')
          if ($LastExitCode) { exit $LastExitCode }

      - name: test script (pwsh)
        if: runner.os != 'Windows'
        shell: pwsh
        env:
          FOUNT_BRANCH: ${{ steps.extract_branch.outputs.branch }}
        run: |
          $env:FOUNT_DIR = "$PWD/fount"
          $env:FOUNT_ACCEPT_EULA = '1'
          $scriptContent = Invoke-RestMethod "https://raw.githubusercontent.com/steve02081504/fount/refs/heads/$($env:FOUNT_BRANCH)/src/runner/main.ps1"
          Invoke-Expression "function fountInstaller { $scriptContent }"
          fountInstaller init
          $ci = Join-Path ([IO.Path]::GetTempPath()) "fount-remove-assert-$PID"
          New-Item -ItemType Directory -Path $ci | Out-Null
          Copy-Item -Recurse -Force "$env:FOUNT_DIR/path/CI/*" $ci
          & (Join-Path $ci 'run-remove-assert.ps1') -Fount (Join-Path $env:FOUNT_DIR 'path/fount.ps1')
          if ($LastExitCode) { exit $LastExitCode }

  path-cmd-smoke:
    name: path CLI smoke
    timeout-minutes: 10
    env:
      FOUNT_REPO_ROOT: ${{ github.workspace }}
      GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: canary

      - name: Apply repo deno version pin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/workflows/scripts/apply_deno_version.sh

      - name: Install CI entry hooks
        shell: bash
        run: bash path/CI/install-hooks.sh "$GITHUB_WORKSPACE"

      - name: path smoke (bash)
        shell: bash
        run: bash path/CI/run-smoke.sh

      - name: path smoke (pwsh)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\path\CI\run-smoke.ps1"

      - name: path smoke (pwsh)
        if: runner.os != 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File path/CI/run-smoke.ps1

      - name: Restore entry hooks
        if: always()
        shell: bash
        run: bash path/CI/restore-hooks.sh "$GITHUB_WORKSPACE"
