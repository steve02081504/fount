	<title>Language Redirect</title>

<body>
	<main aria-hidden="true"><!-- Redirect page; main content is script-driven --></main>
	<script>
		const README_BLOB = 'https://github.com/steve02081504/fount/blob/__FOUNT_GIT_REF__/docs/readme/Readme.'
		const ALIAS = {
			zh: 'zh-CN', 'zh-CN': 'zh-CN', 'zh-TW': 'zh-TW', 'zh-HK': 'zh-TW',
			en: 'en-UK', 'en-UK': 'en-UK', 'en-GB': 'en-UK',
			ja: 'ja-JP', 'ja-JP': 'ja-JP',
			fr: 'fr-FR', 'fr-FR': 'fr-FR',
			es: 'es-ES', 'es-ES': 'es-ES',
			de: 'de-DE', 'de-DE': 'de-DE',
			ru: 'ru-RU', 'ru-RU': 'ru-RU',
			pt: 'pt-PT', 'pt-PT': 'pt-PT', 'pt-BR': 'pt-PT',
			hi: 'hi-IN', 'hi-IN': 'hi-IN',
			ko: 'ko-KR', 'ko-KR': 'ko-KR',
			it: 'it-IT', 'it-IT': 'it-IT',
			vi: 'vi-VN', 'vi-VN': 'vi-VN',
			ar: 'ar-SA', 'ar-SA': 'ar-SA',
			is: 'is-IS', 'is-IS': 'is-IS',
			nl: 'nl-NL', 'nl-NL': 'nl-NL',
			uk: 'uk-UA', 'uk-UA': 'uk-UA',
			lzh: 'lzh',
			emoji: 'emoji',
		}
		const raw = navigator.language || navigator.userLanguage || ''
		const [lang, region] = raw.split('-')
		const tag = region ? `${lang.toLowerCase()}-${region.toUpperCase()}` : lang.toLowerCase()
		window.location.href = README_BLOB + (ALIAS[tag] || ALIAS[lang.toLowerCase()] || 'en-UK') + '.md' + location.hash
	</script>
</body>

</html>
