<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex,nofollow" />
	<meta name="theme-color" content="#070002" />
	<meta property="og:title" content="The Door Was Open: Something Came In Wearing localhost's Face" />
	<meta property="og:url" content="https://steve02081504.github.io/fount/proxy-exposure/" />
	<meta property="og:type" content="website" />
	<meta property="og:description" content="Something came through a public proxy wearing localhost's face. The node could not tell it from itself, so it shut the door. Teach the proxy to leave forwarding marks, and service returns." />
	<meta property="og:image" content="https://steve02081504.github.io/fount/imgs/icon.svg" />
	<meta name="description" content="Something came through a public proxy wearing localhost's face. The node could not tell it from itself, so it shut the door. Teach the proxy to leave forwarding marks, and service returns." />
	<link rel="icon" href="https://steve02081504.github.io/fount/imgs/icon.svg" type="image/svg+xml" />
	<title data-i18n="proxy_exposure.title"></title>
	<script blocking="render" type="module" src="../preload.mjs"></script>
	<link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/400.css" rel="stylesheet" crossorigin="anonymous" />
	<link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/900.css" rel="stylesheet" crossorigin="anonymous" />
	<link rel="stylesheet" href="../base.css" />
	<link rel="stylesheet" href="./index.css" />
	<script type="module" src="./index.mjs"></script>
</head>
<body class="pe">
	<canvas id="flesh" class="pe-layer" aria-hidden="true"></canvas>
	<canvas id="tendrils" class="pe-layer" aria-hidden="true"></canvas>
	<div class="pe-whisper" aria-hidden="true" data-i18n="proxy_exposure.whisper"></div>

	<header class="pe-bar">
		<p id="watching" class="pe-watching" data-i18n="proxy_exposure.watching" data-count="0"></p>
		<div class="pe-controls">
			<label class="pe-language">
				<span class="sr-only" data-i18n="proxy_exposure.language"></span>
				<img class="pe-icon" src="https://api.iconify.design/ph/translate-light.svg?color=%23cbbcab" alt="" crossorigin="anonymous" width="20" height="20" />
				<select id="language" language-check-ignore></select>
			</label>
			<button id="sound" type="button" class="pe-sound" data-i18n="proxy_exposure.sound.off">
				<img class="pe-icon pe-sound-on hidden" src="https://api.iconify.design/ph/waveform-light.svg?color=%23e8d8c6" alt="" crossorigin="anonymous" width="22" height="22" />
				<img class="pe-icon pe-sound-off" src="https://api.iconify.design/ph/speaker-simple-slash-light.svg?color=%23cbbcab" alt="" crossorigin="anonymous" width="22" height="22" />
			</button>
		</div>
	</header>

	<main class="pe-main">
		<h1 class="pe-title">
			<span id="omen" class="pe-omen" data-i18n="proxy_exposure.omen"></span>
			<span class="pe-subtitle" data-i18n="proxy_exposure.title"></span>
		</h1>
		<p class="pe-epigraph" data-i18n="proxy_exposure.epigraph"></p>
		<p class="pe-lede" data-i18n="proxy_exposure.description"></p>
		<p class="pe-lucid-line" data-i18n="proxy_exposure.lucid"></p>

		<section class="pe-chapter">
			<span class="pe-numeral" aria-hidden="true">Ⅰ</span>
			<h2 data-i18n="proxy_exposure.risk.title"></h2>
			<p data-i18n="proxy_exposure.risk.text"></p>
		</section>
		<section class="pe-chapter">
			<span class="pe-numeral" aria-hidden="true">Ⅱ</span>
			<h2 data-i18n="proxy_exposure.action.title"></h2>
			<p data-i18n="proxy_exposure.action.text"></p>
		</section>
		<section id="way-out" class="pe-chapter pe-way-out">
			<span class="pe-numeral" aria-hidden="true">Ⅲ</span>
			<h2 data-i18n="proxy_exposure.recovery.title"></h2>
			<ol>
				<li data-i18n="proxy_exposure.recovery.proxy"></li>
				<li data-i18n="proxy_exposure.recovery.headers"></li>
				<li data-i18n="proxy_exposure.recovery.restart"></li>
			</ol>
		</section>
		<p class="pe-limit" data-i18n="proxy_exposure.limit"></p>
	</main>

	<footer class="pe-footer">
		<p class="pe-hint" data-i18n="proxy_exposure.hint"></p>
	</footer>
	<div id="touched" class="pe-touched" aria-hidden="true" data-i18n="proxy_exposure.touched"></div>
</body>
</html>
