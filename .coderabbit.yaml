# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# fount — CodeRabbit：审美指南 + 重点审查（不含开发工具用法）

language: "zh-CN"
tone_instructions: >-
  直接、简洁、犀利。优先指出违背审美与架构的问题；不客套、不复述 diff、
  不给向后兼容或防御性补丁建议。成品以简洁高效为准，大胆改结构消掉阻挡。
early_access: true

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_instructions: >-
    用中文写简短摘要：改了什么、为何、有无架构/审美风险。不要列文件清单。
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  enable_prompt_for_ai_agents: true
  in_progress_fortune: false

  path_filters:
    - "!**/*.svg"

  path_instructions:
    # ── 全局审美与架构 ──────────────────────────────────────────────────
    - path: "**"
      instructions: |
        违反下列任一条都要指出，并给出更简洁的改法。
        不要建议「先兼容旧行为再慢慢删」或加防御性校验「以防万一」。

        ## 命名
        - 可读全词：`index` / `userMessage` / `context` / `button`；禁止 `i`/`msg`/`ctx`/`btn`/`S`/`aj.json` 等烂名。

        ## 精简原则
        - 效果一致即可，大胆删冗余；不追求最小 diff，追求最终产物简洁优雅高效。

        ## 防御性与信任边界
        - 不为调用者的蠢做防护；垃圾数据直接炸。
        - 前后端互信；后端信任本机加载的文件。
        - 唯一要清扫的是**非本机网络入站**（P2P / federation / 远端节点）。

        ## 架构
        - 精简、DRY、SRP。不向后兼容；不做 `@deprecated` / 重导出；删就删干净。
        - 兼容旧数据是用户或单独导入模块的事，与当前业务模块无关。
        - 不为顶层模块在底层特判；每个模块只做自己该做的事。
        - 代码放对文件/路径；该建目录就建（`xxx/index.mjs` + 子模块），禁止 `xxx_aae.mjs` 式扁平拉屎。
        - 不为公共库加只服务一两个模块的狗屎逻辑。
        - 禁止在源码/测试/夹具/注释中写规划里程碑号（`M1`/`G4` 等）；只按领域语义命名。
        - 模块化：能力优先做成自包含 part（`main.mjs`），对照 `@src/decl/` API。
        - part / shell / plugin 代码禁止 `node:child_process`；OS 启动只走既有出口。

        自问：这足够优雅吗？有没有往公共层塞局部特例？

    # ── 逻辑代码（非 html/xml/svg/css）──────────────────────────────────
    - path: "!**/*.{html,htm,xml,svg,css}"
      instructions: |
        ## 命名与作用域
        - 不用 `_` 当私有前缀；类私有用语言自带机制（JS 用 `#`），否则别导出。
        - 能用模块/包级绑定解决时，禁止往全局对象上挂东西。

        ## 代码简化
        - 禁止只用一次的临时绑定，内联到使用处。
        - 优先短回退、成员检测、直接返回：
          - `if (!member || member.status !== 'active')` → `if (member?.status !== 'active')`
          - `event.content && typeof event.content === 'object' ? event.content : {}` → `event?.content || {}`
          - `type !== 'send' && type !== 'delete'` → `!['send', 'delete'].includes(type)`
          - `const result = xxx; return result` → `return xxx`
          - `typeof content === 'string' ? content : content && typeof content.text === 'string' ? content.text : ''` → `content?.text || content || ''`
          - `typeof channelId === 'string' && /^[\w.-]+$/.test(channelId) && channelId.length <= 128` → `/^[\w.-]{1,127}$/.test(String(channelId))`
          - `if (xxx) { console.log(xxx); return }` → `if (xxx) return console.log(xxx)`
        - 类型盘问与防御性编程是坏味道。
        - 无意义的调试输出不要；仅 error/warning。
        - 揪重复逻辑、无意义分支、底层对顶层的特判。

    # ── 前端 JS（pages + part public/）─────────────────────────────────
    - path: "src/public/pages/**/*.mjs,src/public/pages/**/*.js,src/public/parts/**/public/**/*.mjs,src/public/parts/**/public/**/*.js"
      instructions: |
        - 禁止大段拼接 HTML；用 `renderTemplate` / `mountTemplate` / `withTemplates`。跨 shell 共享模块禁止裸调 `usingTemplates`。
        - 非必要不用 `geti18n`；静态 UI 用 `data-i18n` / `setElementI18n`。`promptDialog` 等传 i18n key，不要先 `geti18n` 再传入。
        - 复用 `@src/public/pages/scripts/`，禁止 shell 内再抄一份。
        - 主题走 `applyTheme()`；对话框优先 `promptDialog` / `openDialogFromTemplate`。
        - 用户/动态内容标 `user-content`；不可信 SVG 头像加 `svg-inliner-ignore`。
        - 未展示完整的 UI 用 `aria-hidden` / `inert` / `hidden`，不要只用 `opacity: 0`。

    # ── Markup ─────────────────────────────────────────────────────────
    - path: "**/*.html,**/*.htm,**/*.xml,**/*.svg"
      instructions: |
        - 能少一层就少一层：无语义、无样式、无行为的包装节点删掉。
        - HTML 优先 DaisyUI 类名，不要再套自定义壳。
        - 模态模板只提供 `modal-box`（+ 可选 `modal-backdrop`），不要再套 `<dialog>`。
        - 同一意图只留一套结构；禁止近乎相同的大块 markup 复制。
        - 静态可见文案用 `data-i18n`；不可见控件不要硬塞解释性文案。
        - 结构归模板、行为归 JS；禁止在 JS 里拼本该进模板的大段 HTML。

    # ── CSS ────────────────────────────────────────────────────────────
    - path: "**/*.css"
      instructions: |
        - 越少越好；能删则删。优先 DaisyUI / 现有主题变量，能用组件类就不要手写平行样式。
        - 自定义规则只补 DaisyUI / 主题覆盖不了的点。
        - 避免无用嵌套、重复选择器、死规则、防御性覆盖。
        - 不要重声明 `.hidden`；局部 `display: flex|grid` 不得把已隐藏 UI 顶出来。
        - 同一视觉意图合并规则；不发明与 DaisyUI 冲突的工具类语义。

    # ── 前端静态交叉 ───────────────────────────────────────────────────
    - path: "src/public/**/*.html,src/public/**/*.css"
      instructions: |
        - 能靠 DaisyUI / 现有类解决的不要新增 CSS；能靠更扁 DOM 解决的不要堆选择器。
        - 主题只走既有 DaisyUI 通道，不要平行维护颜色表。

    # ── i18n ────────────────────────────────────────────────────────────
    - path: "src/public/locales/**"
      instructions: |
        - 键树：shell 文案挂 shell id 下（如 `chat.profile`）；共享挂 `util.*`；顶层仅 `tips` / `404` / `directoryListing` / `fountConsole`。
        - emoji 除非不得已否则不应出现文字，而是使用emoji进行意译。

    # ── 后端 ────────────────────────────────────────────────────────────
    - path: "src/server/**/*.mjs,src/server/**/*.js,src/server/**/*.ts,src/scripts/**/*.mjs,src/scripts/**/*.js,src/public/parts/**/src/**/*.mjs,src/public/parts/**/src/**/*.js,src/public/parts/**/main.mjs"
      instructions: |
        - 新能力优先做成 part，对照 `@src/decl/`；生命周期走 `parts_loader`。
        - 注册表走 `fount.json` registries 与 `/api/registries/:name`。
        - 信任本机文件与前后端约定；校验集中在网络边界。
        - 文案用既有 locale helper（如 `localesForUser`），不要引入浏览器 i18n API。

    - path: "src/server/p2p_server/**"
      instructions: |
        - 入站（discovery / link / WS federation / remoteIngest / part_query 等）必须在边界校验。
        - 落盘后的本地数据不要重复过度清洗；边界校验别渗进纯本地路径。

    - path: "src/public/parts/**"
      instructions: |
        - Part 自包含，有 `main.mjs`；仿现有结构。
        - 领域逻辑留在 part 内；不要把 part 特例塞进公共 `pages/scripts`。
        - Emoji UI/排序在核心 `features/emoji/` + `emojiPicker`；chat/social 只供给 provider。
        - 别把 DOM 代码塞进 part 的 `src/`。

    # ── 测试 ────────────────────────────────────────────────────────────
    - path: "**/test/**,**/tests/**,**/*.test.mjs,**/*.spec.mjs,**/*.test.js,**/*.spec.js"
      instructions: |
        - 禁止为让测试通过而削弱产品逻辑或 watcher。
        - 断言不放宽；夹具按领域语义命名，禁止里程碑号。

    # ── Shell 入口 ──────────────────────────────────────────────────────
    - path: "path/**/*.ps1,path/**/*.sh"
      instructions: |
        - `fount.ps1` / `fount.sh` 行为对齐。
        - 避免无意义防御分支与一次性临时变量。

    # ── 文档 ────────────────────────────────────────────────────────────
    - path: "**/AGENTS.md,docs/**/*.md"
      instructions: |
        - AGENTS.md 保持短、可执行、与代码一致。
        - 设计/评审文档可含里程碑号；不要建议写进源码。

  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - "draft"
      - "WIP"
      - "DO NOT MERGE"
    drafts: false
    base_branches:
      - "master"

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: true
    autofix:
      enabled: true

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "warning"
      requirements: >-
        简洁说明变更目的（why），避免纯文件列表或空话标题。
    description:
      mode: "warning"
    issue_assessment:
      mode: "off"
    custom_checks:
      - name: "审美与简洁"
        mode: "warning"
        instructions: >-
          一次性临时绑定、烂缩写、多余类型盘问/防御、@deprecated/重导出、兼容旧数据分支、
          markup 无意义包装或缺 data-i18n、CSS 能删未删或平行造已有样式——未通过；点明位置与更简改法。

  tools:
    eslint:
      enabled: true
    shellcheck:
      enabled: true
    psscriptanalyzer:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    htmlhint:
      enabled: true
    stylelint:
      enabled: true
    github-checks:
      enabled: true
    reactDoctor:
      enabled: false
    biome:
      enabled: false

chat:
  auto_reply: true
  art: false

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "**/llms.txt"
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
  linked_repositories:
    - repository: steve02081504/fount-p2p
      instructions: >-
        fount-p2p 核心包（npm:@steve02081504/fount-p2p）。核对入站边界与 API 契约是否一致；勿在本仓重复实现包内已有逻辑。

code_generation:
  docstrings:
    language: "zh-CN"
  unit_tests:
    path_instructions:
      - path: "**/*"
        instructions: |
          用项目 `fount test` 与现有 `test/` 布局；不要生成 Jest/Vitest/Mocha 脚手架。
          断言不放宽；测试代码同样遵守命名与简洁审美。
