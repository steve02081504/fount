<li class="char-item list-row cursor-pointer" data-char-id="${id}" tabindex="0" role="button">
	<img class="size-10 rounded-box bg-base-300" src="${avatar}" alt="" aria-hidden="true" />
	<div class="min-w-0 flex-grow">
		<p class="font-semibold truncate" user-content>${name}</p>
		<p class="text-xs opacity-60 truncate" user-content>${description}</p>
	</div>
</li>
