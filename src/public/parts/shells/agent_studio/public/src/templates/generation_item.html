<li class="generation-item" data-generation-id="${escapeHtml(id)}" tabindex="0" role="button">
	<span class="generation-dot" aria-hidden="true"></span>
	<div class="generation-item-body">
		<p class="generation-preview" user-content>${escapeHtml(preview)}</p>
		<p class="generation-meta" user-content>${escapeHtml(meta)}</p>
	</div>
	<span class="badge ${badgeClass}">${escapeHtml(status)}</span>
</li>
