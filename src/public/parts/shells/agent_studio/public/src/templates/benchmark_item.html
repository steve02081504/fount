<li class="benchmark-item list-row cursor-pointer" data-benchmark-id="${id}" tabindex="0" role="button">
	<div class="min-w-0 flex-grow">
		<p class="font-semibold truncate" user-content>${name}</p>
		<p class="text-xs opacity-60 truncate" user-content>${description}</p>
	</div>
	<span class="badge badge-ghost">${caseCount}</span>
</li>
