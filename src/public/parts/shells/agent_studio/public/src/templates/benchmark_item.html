<li class="benchmark-item" data-benchmark-id="${escapeHtml(id)}" tabindex="0" role="button">
	<div class="benchmark-item-body">
		<p class="benchmark-name" user-content>${escapeHtml(name)}</p>
		<p class="benchmark-desc" user-content>${escapeHtml(description)}</p>
	</div>
	<span class="badge badge-ghost">${escapeHtml(caseCount)}</span>
</li>
