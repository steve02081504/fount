<button type="button" class="run-item surface">
	<div class="run-item-head">
		<strong class="run-task" user-content>${escapeHtml(task)}</strong>
		<span class="badge ${badgeClass}">${escapeHtml(state)}</span>
	</div>
	<span class="run-id" user-content>${escapeHtml(runId)}</span>
	<p class="run-detail" prompt-content>${escapeHtml(detail)}</p>
</button>
