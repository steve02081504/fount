<div class="conversation-item" data-conversation-key="${escapeHtml(key)}" tabindex="0" role="button">
	<span class="conversation-dot" aria-hidden="true"></span>
	<div class="conversation-item-body">
		<p class="conversation-title" user-content>${escapeHtml(title)}</p>
		<p class="conversation-meta" user-content>${escapeHtml(meta)}</p>
	</div>
	<span class="badge ${badgeClass}">${escapeHtml(count)}</span>
</div>
