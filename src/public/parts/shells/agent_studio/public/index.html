<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta property="og:title" content="Agent Studio" />
	<meta property="og:url" content="https://steve02081504.github.io/fount/protocol?url=fount://page/parts/shells:agent_studio/" />
	<meta property="og:type" content="website" />
	<meta property="og:description" content="Inspect generations and sub-agent runs, and benchmark characters." />
	<meta name="description" content="Inspect generations and sub-agent runs, and benchmark characters." />
	<meta property="og:image" content="https://repository-images.githubusercontent.com/862251163/0ac90205-ae40-4fc6-af67-1e28d074c76b" />
	<title data-i18n="agent_studio.title"></title>
	<link rel="icon" href="/favicon.ico" />
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<link rel="manifest" href="/manifest.json" />
	<script blocking="render" type="module" src="/preload.mjs"></script>
	<link href="https://cdn.jsdelivr.net/npm/daisyui/daisyui.css" rel="stylesheet" type="text/css" crossorigin="anonymous" />
	<link href="/base.css" rel="stylesheet" type="text/css" crossorigin="anonymous" />
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" crossorigin="anonymous"></script>
	<script type="module" src="/base.mjs"></script>
	<link rel="stylesheet" href="./index.css" type="text/css" />
</head>

<body>
	<div id="shell" class="shell">
		<nav class="side-nav" data-i18n="agent_studio.nav.region">
			<div class="brand">
				<span class="brand-mark icon icon-flask" aria-hidden="true"></span>
				<span class="brand-title" data-i18n="agent_studio.title"></span>
			</div>
			<div class="side-nav-links">
				<button type="button" data-view="dashboard" class="nav-btn btn btn-ghost justify-start active">
					<span class="icon icon-dashboard" aria-hidden="true"></span>
					<span class="nav-label" data-i18n="agent_studio.nav.dashboard"></span>
				</button>
				<button type="button" data-view="generations" class="nav-btn btn btn-ghost justify-start">
					<span class="icon icon-branch" aria-hidden="true"></span>
					<span class="nav-label" data-i18n="agent_studio.nav.generations"></span>
				</button>
				<button type="button" data-view="benchmarks" class="nav-btn btn btn-ghost justify-start">
					<span class="icon icon-benchmark" aria-hidden="true"></span>
					<span class="nav-label" data-i18n="agent_studio.nav.benchmarks"></span>
				</button>
				<button type="button" data-view="settings" class="nav-btn btn btn-ghost justify-start">
					<span class="icon icon-settings" aria-hidden="true"></span>
					<span class="nav-label" data-i18n="agent_studio.nav.settings"></span>
				</button>
			</div>
			<button type="button" id="globalRefreshButton" class="side-refresh btn btn-ghost justify-start">
				<span class="icon icon-refresh" aria-hidden="true"></span>
				<span class="nav-label" data-i18n="agent_studio.actions.refreshData"></span>
			</button>
		</nav>

		<main class="content-col">
			<h1 class="sr-only" data-i18n="agent_studio.title"></h1>

			<section id="dashboardView" class="view">
				<header class="view-header">
					<div class="view-header-text">
						<h2 class="view-title" data-i18n="agent_studio.dashboard.title"></h2>
						<p class="view-subtitle" data-i18n="agent_studio.dashboard.description"></p>
					</div>
					<div class="view-header-actions">
						<button id="dashboardRefreshButton" type="button" class="btn btn-ghost btn-sm btn-square" data-i18n="agent_studio.actions.refresh">
							<span class="icon icon-refresh" aria-hidden="true"></span>
						</button>
					</div>
				</header>
				<div class="dashboard-grid">
					<aside class="char-panel surface">
						<h3 class="panel-title" data-i18n="agent_studio.chars.title"></h3>
						<div class="search-wrap">
							<span class="icon icon-search search-icon" aria-hidden="true"></span>
							<input id="charSearchInput" type="search" class="search-input" data-i18n="agent_studio.chars.search" placeholder="" autocomplete="off" />
						</div>
						<ul id="charList" class="char-list"></ul>
						<div id="charListEmpty" class="panel-empty hidden"></div>
					</aside>

					<section class="detail-panel surface">
						<div id="charDetail" class="char-detail hidden">
							<header class="char-hero">
								<img id="charHeroAvatar" class="char-hero-avatar" src="" alt="" aria-hidden="true" />
								<div class="char-hero-body">
									<h3 id="charHeroName" class="char-hero-name" user-content></h3>
									<p id="charHeroDescription" class="char-hero-desc" user-content></p>
									<div id="charHeroInterfaces" class="char-hero-interfaces"></div>
								</div>
							</header>
							<section class="detail-section">
								<h4 class="section-heading" data-i18n="agent_studio.detail.subAgents"></h4>
								<div id="subAgentList" class="run-grid"></div>
								<div id="subAgentEmpty" class="section-empty hidden"></div>
							</section>
							<section class="detail-section">
								<h4 class="section-heading" data-i18n="agent_studio.generations.conversations"></h4>
								<div id="generationList" class="generation-list"></div>
								<div id="generationEmpty" class="section-empty hidden"></div>
							</section>
						</div>
						<div id="charDetailPlaceholder" class="detail-placeholder"></div>
					</section>
				</div>
			</section>

			<section id="generationsView" class="view hidden">
				<header class="view-header">
					<div class="view-header-text">
						<h2 class="view-title" data-i18n="agent_studio.generations.title"></h2>
						<p class="view-subtitle" data-i18n="agent_studio.generations.description"></p>
					</div>
					<div class="view-header-actions">
						<label class="field field-inline">
							<span class="field-label" data-i18n="agent_studio.generations.filterChar"></span>
							<select id="generationCharFilter" class="select select-bordered select-sm"></select>
						</label>
						<button id="generationsRefreshButton" type="button" class="btn btn-ghost btn-sm btn-square" data-i18n="agent_studio.actions.refresh">
							<span class="icon icon-refresh" aria-hidden="true"></span>
						</button>
						<button id="generationsClearButton" type="button" class="btn btn-error btn-outline btn-sm">
							<span class="icon icon-delete" aria-hidden="true"></span>
							<span data-i18n="agent_studio.clear.label"></span>
						</button>
					</div>
				</header>
				<div class="view-tabs tabs tabs-box tabs-sm" role="tablist">
					<button type="button" class="tab tab-active" role="tab" aria-selected="true" data-generation-tab="records" data-i18n="agent_studio.generations.conversations"></button>
					<button type="button" class="tab" role="tab" aria-selected="false" data-generation-tab="chains" data-i18n="agent_studio.generations.chains"></button>
				</div>
				<div id="generationRecordsPanel" class="generation-panel">
					<p id="generationRecordsCount" class="list-count"></p>
					<div id="generationRecordsList" class="generation-list"></div>
					<div id="generationRecordsEmpty" class="section-empty hidden"></div>
				</div>
				<div id="generationChainsPanel" class="generation-panel hidden">
					<ul id="generationChainsList" class="chain-list"></ul>
					<div id="generationChainsEmpty" class="section-empty hidden"></div>
				</div>
			</section>

			<section id="benchmarksView" class="view hidden">
				<header class="view-header">
					<div class="view-header-text">
						<h2 class="view-title" data-i18n="agent_studio.benchmarks.title"></h2>
						<p class="view-subtitle" data-i18n="agent_studio.benchmarks.description"></p>
					</div>
					<div class="view-header-actions">
						<label class="btn btn-outline btn-sm" for="importBenchmarkFile" data-i18n="agent_studio.benchmarks.import"></label>
						<input id="importBenchmarkFile" class="sr-only" type="file" accept=".json,.txt,application/json,text/plain" />
						<button id="newBenchmarkButton" type="button" class="btn btn-primary btn-sm" data-i18n="agent_studio.benchmarks.new"></button>
					</div>
				</header>
				<div class="benchmarks-grid">
					<aside class="benchmark-panel surface">
						<ul id="benchmarkList" class="benchmark-list"></ul>
						<div id="benchmarkEmpty" class="panel-empty hidden"></div>
					</aside>
					<section class="benchmark-editor surface">
						<div id="benchmarkDetail" class="hidden">
							<header class="editor-head">
								<h3 id="benchmarkTitle" class="editor-title" user-content></h3>
								<button id="exportBenchmarkButton" type="button" class="btn btn-outline btn-sm" data-i18n="agent_studio.benchmarks.export"></button>
								<button id="deleteBenchmarkButton" type="button" class="btn btn-ghost btn-sm btn-error btn-square" data-i18n="agent_studio.benchmarks.delete">
									<span class="icon icon-delete" aria-hidden="true"></span>
								</button>
							</header>
							<div class="run-config">
								<label class="field">
									<span class="field-label" data-i18n="agent_studio.benchmarks.selectChar"></span>
									<select id="runCharSelect" class="select select-bordered select-sm"></select>
								</label>
								<label class="field">
									<span class="field-label" data-i18n="agent_studio.benchmarks.judgeSource"></span>
									<input id="runJudgeSource" type="text" class="input input-bordered input-sm" />
								</label>
								<button id="runBenchmarkButton" type="button" class="btn btn-primary btn-sm">
									<span class="icon icon-play" aria-hidden="true"></span>
									<span data-i18n="agent_studio.benchmarks.run"></span>
								</button>
							</div>
							<label class="field field-block">
								<span class="field-label" data-i18n="agent_studio.benchmarks.cases"></span>
								<textarea id="benchmarkCasesText" class="textarea textarea-bordered cases-editor" spellcheck="false"></textarea>
							</label>
							<button id="saveBenchmarkButton" type="button" class="btn btn-outline btn-sm" data-i18n="agent_studio.benchmarks.saveCases"></button>
							<section class="results-block">
								<h4 class="section-heading" data-i18n="agent_studio.benchmarks.results"></h4>
								<div id="benchmarkStats" class="stats-line"></div>
								<ul id="benchmarkResults" class="result-list"></ul>
								<div id="benchmarkResultsEmpty" class="section-empty hidden"></div>
							</section>
						</div>
						<div id="benchmarkPlaceholder" class="detail-placeholder"></div>
					</section>
				</div>
			</section>

			<section id="conversationView" class="view hidden">
				<header class="view-header">
					<div class="view-header-text">
						<h2 class="view-title" data-i18n="agent_studio.conversation.title"></h2>
						<p class="view-subtitle" data-i18n="agent_studio.conversation.description"></p>
					</div>
					<div class="view-header-actions">
						<button id="conversationBackButton" type="button" class="btn btn-ghost btn-sm" data-i18n="agent_studio.conversation.back"></button>
					</div>
				</header>
				<div class="conversation-view">
					<div id="conversationMeta" class="meta-chips"></div>
					<div id="conversationReplay" class="conversation-replay surface">
						<p id="conversationCacheSummary" class="stats-line" user-content></p>
						<div id="conversationTimeline" class="conversation-timeline"></div>
						<input id="conversationReplaySlider" type="range" min="0" max="0" value="0" data-i18n="agent_studio.conversation.replayProgress" aria-label="" />
						<canvas id="conversationCacheChart" class="conversation-cache-chart" role="img" data-i18n="agent_studio.conversation.cacheChart" aria-label=""></canvas>
						<span id="conversationReplaySelection" class="meta-chip"></span>
					</div>
					<div id="conversationSubagent" class="hidden">
						<section class="dialog-section">
							<h3 class="dialog-section-title" data-i18n="agent_studio.subagent.task"></h3>
							<pre id="subagentConversationTask" class="code-block" prompt-content></pre>
						</section>
						<div id="subagentTranscript" class="subagent-conversation"></div>
						<pre id="subagentLivePreview" class="code-block hidden" prompt-content></pre>
						<form id="subagentMessageForm" class="subagent-composer hidden">
							<textarea id="subagentMessageInput" class="textarea textarea-bordered" rows="3" maxlength="20000" required data-i18n="agent_studio.subagent.messagePlaceholder" placeholder=""></textarea>
							<button class="btn btn-primary btn-sm" type="submit" data-i18n="agent_studio.subagent.send"></button>
						</form>
					</div>
					<div id="conversationTranscript" class="conversation-messages"></div>
					<div id="conversationGenerations" class="conversation-generations"></div>
					<div id="conversationEmpty" class="section-empty hidden">
						<p data-i18n="agent_studio.conversation.empty"></p>
					</div>
				</div>
			</section>

			<section id="settingsView" class="view hidden">
				<header class="view-header">
					<div class="view-header-text">
						<h2 class="view-title" data-i18n="agent_studio.settings.title"></h2>
						<p class="view-subtitle" data-i18n="agent_studio.settings.description"></p>
					</div>
				</header>
				<div class="settings-panel">
					<section class="settings-card surface">
						<h3 class="settings-card-title" data-i18n="agent_studio.retention.title"></h3>
						<p class="settings-hint" data-i18n="agent_studio.retention.hint"></p>
						<div class="retention-fields">
							<label class="field">
								<span class="field-label" data-i18n="agent_studio.retention.prompt"></span>
								<input id="retentionPrompt" type="number" min="0" step="0.5" class="input input-bordered input-sm" />
							</label>
							<label class="field">
								<span class="field-label" data-i18n="agent_studio.retention.conversation"></span>
								<input id="retentionConversation" type="number" min="0" step="0.5" class="input input-bordered input-sm" />
							</label>
							<button id="retentionSave" type="button" class="btn btn-primary btn-sm" data-i18n="agent_studio.retention.save"></button>
						</div>
					</section>
					<section class="settings-card surface settings-danger">
						<h3 class="settings-card-title" data-i18n="agent_studio.clear.title"></h3>
						<p class="settings-hint" data-i18n="agent_studio.clear.hint"></p>
						<button id="clearAllGenerationsButton" type="button" class="btn btn-error btn-sm">
							<span class="icon icon-delete" aria-hidden="true"></span>
							<span data-i18n="agent_studio.clear.all"></span>
						</button>
					</section>
				</div>
			</section>
		</main>

		<nav class="mobile-tabbar dock dock-sm" data-i18n="agent_studio.nav.mobile">
			<button type="button" data-view="dashboard" class="nav-btn dock-active">
				<span class="icon icon-dashboard" aria-hidden="true"></span>
				<span class="dock-label" data-i18n="agent_studio.nav.dashboard"></span>
			</button>
			<button type="button" data-view="generations" class="nav-btn">
				<span class="icon icon-branch" aria-hidden="true"></span>
				<span class="dock-label" data-i18n="agent_studio.nav.generations"></span>
			</button>
			<button type="button" data-view="benchmarks" class="nav-btn">
				<span class="icon icon-benchmark" aria-hidden="true"></span>
				<span class="dock-label" data-i18n="agent_studio.nav.benchmarks"></span>
			</button>
			<button type="button" data-view="settings" class="nav-btn">
				<span class="icon icon-settings" aria-hidden="true"></span>
				<span class="dock-label" data-i18n="agent_studio.nav.settings"></span>
			</button>
		</nav>
	</div>

	<dialog id="generationDialog" class="modal" aria-labelledby="generationDialogTitle">
		<div class="modal-box generation-dialog-box">
			<header class="dialog-head">
				<h2 id="generationDialogTitle" class="dialog-title" data-i18n="agent_studio.generation.title"></h2>
				<form method="dialog">
					<button class="btn btn-ghost btn-sm btn-square" data-i18n="agent_studio.actions.close">
						<span class="icon icon-close" aria-hidden="true"></span>
					</button>
				</form>
			</header>
			<div id="generationDialogMeta" class="meta-chips"></div>
			<section class="dialog-section">
				<h3 class="dialog-section-title" data-i18n="agent_studio.generation.prompt"></h3>
				<pre id="generationDialogPrompt" class="code-block" prompt-content></pre>
			</section>
			<section class="dialog-section">
				<h3 class="dialog-section-title" data-i18n="agent_studio.generation.response"></h3>
				<pre id="generationDialogResponse" class="code-block" prompt-content></pre>
			</section>
		</div>
		<form method="dialog" class="modal-backdrop">
			<button data-i18n="agent_studio.actions.close"></button>
		</form>
	</dialog>

	<script type="module" src="./index.mjs"></script>
</body>

</html>
