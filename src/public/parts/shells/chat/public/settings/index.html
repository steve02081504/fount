<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta property="og:title" content="The Circle's Accord: fount Group Settings" />
	<meta property="og:url" content="https://steve02081504.github.io/fount/protocol?url=fount://page/parts/shells:chat/settings/" />
	<meta property="og:type" content="website" />
	<meta property="og:description" content="Tend to a group's identity, its members, permissions, and the tools that bind your shared stage. Every gathering needs its own agreed-upon light." />
	<meta name="description" content="Tend to a group's identity, its members, permissions, and the tools that bind your shared stage. Every gathering needs its own agreed-upon light." />
	<meta property="og:image" content="https://repository-images.githubusercontent.com/862251163/0ac90205-ae40-4fc6-af67-1e28d074c76b" />
	<title data-i18n="chat.group.settings.page.title"></title>
	<link rel="icon" href="/favicon.ico" />
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<script blocking="render" type="module" src="/preload.mjs"></script>
	<link href="https://cdn.jsdelivr.net/npm/daisyui/daisyui.css" rel="stylesheet" type="text/css" crossorigin="anonymous" />
	<link href="/base.css" rel="stylesheet" type="text/css" crossorigin="anonymous" />
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" crossorigin="anonymous"></script>
	<script type="module" src="/base.mjs"></script>
	<link href="./settings.css" rel="stylesheet" type="text/css" />
</head>

<body class="bg-base-100 min-h-screen">
	<main class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
		<header class="mb-6 flex flex-col gap-1 border-b border-base-300/70 pb-5">
			<p class="text-xs font-bold uppercase tracking-widest text-primary" data-i18n="chat.group.settings.page.kicker"></p>
			<h1 class="text-3xl font-bold tracking-tight" data-i18n="chat.group.settings.page.title"></h1>
			<p class="mt-1 max-w-xl text-sm leading-relaxed opacity-60" data-i18n="chat.group.settings.page.subtitle"></p>
		</header>

		<div class="grid grid-cols-1 items-start gap-6 md:grid-cols-[14rem_minmax(0,1fr)] lg:gap-8">
			<nav class="settings-nav flex flex-row items-center gap-1 overflow-x-auto rounded-box border border-base-300 bg-base-200 p-2 shadow-sm md:sticky md:top-4 md:flex-col md:items-stretch md:overflow-visible scrollbar-none" role="tablist" aria-orientation="vertical" data-i18n-aria-label="chat.group.settings.page.navigationLabel">
				<button type="button" role="tab" class="settings-nav-item tab-active" id="nav-general" data-section="general" aria-controls="panel-general" aria-selected="true" tabindex="0" data-i18n="chat.group.settings.page.tabs.general"></button>
				<button type="button" role="tab" class="settings-nav-item hidden" id="nav-members" data-section="members" aria-controls="panel-members" aria-selected="false" tabindex="-1" data-i18n="chat.group.settings.page.tabs.members"></button>
				<button type="button" role="tab" class="settings-nav-item hidden" id="nav-permissions" data-section="permissions" aria-controls="panel-permissions" aria-selected="false" tabindex="-1" data-i18n="chat.group.settings.page.tabs.permissions"></button>
				<button type="button" role="tab" class="settings-nav-item hidden" id="nav-group-perms" data-section="group-perms" aria-controls="panel-group-perms" aria-selected="false" tabindex="-1" data-i18n="chat.group.settings.page.tabs.groupPermissions"></button>
				<button type="button" role="tab" class="settings-nav-item hidden" id="nav-emojis" data-section="emojis" aria-controls="panel-emojis" aria-selected="false" tabindex="-1" data-i18n="chat.group.settings.page.tabs.emojis"></button>

				<div class="settings-nav-group hidden contents gap-1 md:mt-1 md:flex md:flex-col md:border-t md:border-base-content/10 md:pt-2" data-nav-group="advanced">
					<p class="hidden px-2 text-xs font-bold uppercase tracking-widest text-base-content/50 md:block" data-i18n="chat.group.settings.page.advanced.hubTitle"></p>
					<button type="button" role="tab" class="settings-nav-item hidden" id="nav-channel-perms" data-section="channel-perms" aria-controls="panel-channel-perms" aria-selected="false" tabindex="-1" data-i18n="chat.group.settings.page.tabs.channelPermissions"></button>
					<button type="button" role="tab" class="settings-nav-item hidden" id="nav-storage" data-section="storage" aria-controls="panel-storage" aria-selected="false" tabindex="-1" data-i18n="chat.group.settings.page.tabs.storage"></button>
					<button type="button" role="tab" class="settings-nav-item hidden" id="nav-audit" data-section="audit" aria-controls="panel-audit" aria-selected="false" tabindex="-1" data-i18n="chat.group.settings.page.tabs.audit"></button>
				</div>
			</nav>

			<div class="flex min-w-0 flex-col gap-5">
				<div id="panel-general" class="settings-panel" role="tabpanel" aria-labelledby="nav-general">
					<div id="group-settings-container"></div>
				</div>

				<div id="panel-members" class="settings-panel hidden" role="tabpanel" aria-labelledby="nav-members" hidden>
					<div class="card settings-card bg-base-200">
						<div class="card-body">
							<h2 class="card-title mb-4" data-i18n="chat.group.settings.page.membersTitle"></h2>
							<div id="members-list" class="space-y-2"></div>
						</div>
					</div>
				</div>

				<div id="panel-emojis" class="settings-panel hidden" role="tabpanel" aria-labelledby="nav-emojis" hidden>
					<div id="group-emojis-container"></div>
				</div>

				<div id="panel-permissions" class="settings-panel hidden" role="tabpanel" aria-labelledby="nav-permissions" hidden>
					<div id="permission-settings-container"></div>
				</div>

				<div id="panel-group-perms" class="settings-panel hidden" role="tabpanel" aria-labelledby="nav-group-perms" hidden>
					<div id="group-perms-container"></div>
				</div>

				<div id="panel-channel-perms" class="settings-panel hidden" role="tabpanel" aria-labelledby="nav-channel-perms" hidden>
					<div id="channel-perms-container"></div>
				</div>

				<div id="panel-storage" class="settings-panel hidden" role="tabpanel" aria-labelledby="nav-storage" hidden>
					<div id="group-archive-container"></div>
				</div>

				<div id="panel-audit" class="settings-panel hidden" role="tabpanel" aria-labelledby="nav-audit" hidden>
					<div class="card settings-card bg-base-200">
						<div class="card-body">
							<div class="mb-4 flex flex-wrap items-center justify-between gap-3">
								<div>
									<h2 class="card-title" data-i18n="chat.group.auditLog.title"></h2>
									<p class="mt-1 text-sm opacity-70" data-i18n="chat.group.auditLog.hint"></p>
								</div>
								<div class="flex flex-wrap items-center gap-2">
									<label class="sr-only" for="audit-log-type-filter" data-i18n="chat.group.auditLog.filterLabel"></label>
									<select id="audit-log-type-filter" class="select select-bordered select-sm"></select>
									<button type="button" id="audit-log-refresh" class="btn btn-outline btn-sm" data-i18n="chat.group.auditLog.refresh"></button>
								</div>
							</div>
							<div id="audit-log-container" class="hidden">
								<div class="grid grid-cols-[minmax(7rem,auto)_minmax(5rem,8rem)_minmax(6rem,9rem)_1fr] gap-2 border-b border-base-300 px-2 py-2 text-xs font-semibold opacity-70">
									<span data-i18n="chat.group.auditLog.col.time"></span>
									<span data-i18n="chat.group.auditLog.col.type"></span>
									<span data-i18n="chat.group.auditLog.col.actor"></span>
									<span data-i18n="chat.group.auditLog.col.summary"></span>
								</div>
								<div id="audit-log-scroll" class="max-h-[min(60vh,32rem)] overflow-y-auto"></div>
							</div>
							<p id="audit-log-empty" class="hidden py-6 text-center text-sm opacity-60" data-i18n="chat.group.auditLog.empty"></p>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<script type="module" src="./index.mjs"></script>
</body>

</html>
