<div class="card bg-base-200 settings-card">
	<div class="card-body">
		<h2 class="card-title" data-i18n="chat.group.settings.page.tabs.channelPermissions"></h2>
		<p class="text-sm opacity-70" data-i18n="chat.group.settings.page.channelPerms.hint"></p>
		${channels.length ? `
		<div class="flex flex-col lg:flex-row gap-4">
			<div class="lg:w-52 shrink-0">
				<div class="text-xs font-semibold opacity-60 mb-2" data-i18n="chat.group.settings.page.channelPerms.selectChannel"></div>
				<ul class="menu menu-sm bg-base-300 rounded-box p-1 max-h-64 overflow-y-auto">
					${channels.map(ch => `
					<li>
						<button type="button" class="${ch.id === selectedChannelId ? 'active' : ''}" data-action="select-channel" data-channel-id="${escapeHtml(ch.id)}">
							${escapeHtml(ch.name)}
						</button>
					</li>
					`).join('')}
				</ul>
			</div>
			<div class="flex-1 min-w-0 space-y-3">
				${rolePanels.map(panel => `
				<details class="settings-role" data-role-panel="${escapeHtml(panel.roleId)}" ${panel.open ? 'open' : ''}>
					<summary>
						<span class="settings-role-swatch" style="background-color: ${escapeHtml(panel.color)}" aria-hidden="true"></span>
						<span class="truncate">${escapeHtml(panel.name)}</span>
						${panel.hasOverride ? '<span class="badge badge-sm badge-warning" data-i18n="chat.group.settings.page.channelPerms.overridden"></span>' : ''}
					</summary>
					<div class="settings-role-body">
						<div class="settings-role-perms">
							${panel.permRows.map(row => `
							<div class="flex items-center justify-between gap-2 py-1">
								<span class="text-sm" data-i18n="chat.group.settings.page.perm.${row.perm}"></span>
								<div class="join join-horizontal" role="group" data-role-id="${escapeHtml(panel.roleId)}" data-perm="${row.perm}">
									<button type="button" class="btn btn-xs join-item ${row.state === 'neutral' ? 'btn-active' : 'btn-ghost'}" data-action="channel-perm-state" data-state="neutral" data-i18n="chat.group.settings.page.channelPerms.stateNeutral"></button>
									<button type="button" class="btn btn-xs join-item ${row.state === 'allow' ? 'btn-success btn-active' : 'btn-ghost'}" data-action="channel-perm-state" data-state="allow" data-i18n="chat.group.settings.page.channelPerms.stateAllow"></button>
									<button type="button" class="btn btn-xs join-item ${row.state === 'deny' ? 'btn-error btn-active' : 'btn-ghost'}" data-action="channel-perm-state" data-state="deny" data-i18n="chat.group.settings.page.channelPerms.stateDeny"></button>
								</div>
							</div>
							`).join('')}
						</div>
						${panel.hasOverride ? `
						<button type="button" class="btn btn-ghost btn-xs text-error w-fit" data-action="clear-role-override" data-role-id="${escapeHtml(panel.roleId)}" data-i18n="chat.group.settings.page.channelPerms.clearOverride"></button>
						` : ''}
					</div>
				</details>
				`).join('')}
			</div>
		</div>
		` : `<p class="text-sm opacity-60" data-i18n="chat.group.settings.page.channelPerms.noChannels"></p>`}
	</div>
</div>
