<div data-translation-part="body" class="card card-border bg-base-100 p-4 space-y-3">
	<label class="label cursor-pointer justify-between gap-3">
		<span class="label-text flex items-center gap-1.5">
			<span data-i18n="chat.hub.translationPrefs.autoTranslate"></span>
		</span>
		<input type="checkbox" class="toggle toggle-primary" id="auto-translate" ${autoTranslateChecked} />
	</label>
	<p class="text-xs opacity-60" data-i18n="chat.hub.translationPrefs.hint"></p>
</div>
<div data-translation-part="footer">
	<button type="button" class="btn btn-primary" data-action="save" data-i18n="chat.hub.translationPrefs.save"></button>
	<button type="button" class="btn btn-ghost" data-action="close" data-i18n="chat.hub.modalClose"></button>
</div>
