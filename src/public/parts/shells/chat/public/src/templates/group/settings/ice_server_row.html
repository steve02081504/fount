<div class="grid grid-cols-1 md:grid-cols-4 gap-2 items-end" data-ice-row="1">
	<input type="text" class="input input-bordered input-sm md:col-span-2" data-ice-url data-i18n="chat.group.settings.ice.url" value="${urls}">
	<input type="text" class="input input-bordered input-sm" data-ice-user data-i18n="chat.group.settings.ice.user" value="${username}">
	<div class="flex gap-1">
		<input type="password" class="input input-bordered input-sm flex-1" data-ice-cred data-i18n="chat.group.settings.ice.cred" value="${credential}">
		<button type="button" class="btn btn-ghost btn-sm" data-ice-remove data-i18n="chat.group.settings.ice.remove">×</button>
	</div>
</div>
