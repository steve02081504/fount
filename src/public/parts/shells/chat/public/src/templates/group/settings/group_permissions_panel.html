${rolePanels.length ? `
<div class="card bg-base-200 settings-card">
	<div class="card-body">
		<h2 class="card-title" data-i18n="chat.group.settings.page.tabs.groupPermissions"></h2>
		<p class="text-sm opacity-70" data-i18n="chat.group.settings.page.groupPerms.hint"></p>
		<div class="flex-1 min-w-0 space-y-3">
			${rolePanels.map(panel => `
			<details class="settings-role" data-role-panel="${escapeHtml(panel.roleId)}" ${panel.open ? 'open' : ''}>
				<summary>
					<span class="settings-role-swatch" style="background-color: ${escapeHtml(panel.color)}" aria-hidden="true"></span>
					<span class="truncate">${escapeHtml(panel.name)}</span>
					${panel.hasOverride ? '<span class="badge badge-sm badge-warning" data-i18n="chat.group.settings.page.channelPerms.overridden"></span>' : ''}
				</summary>
				<div class="settings-role-body">
					<div class="settings-role-perms"></div>
					${panel.hasOverride ? `
					<button type="button" class="btn btn-ghost btn-xs text-error w-fit" data-action="clear-group-override" data-role-id="${escapeHtml(panel.roleId)}" data-i18n="chat.group.settings.page.channelPerms.clearOverride"></button>
					` : ''}
				</div>
			</details>
			`).join('')}
		</div>
	</div>
</div>
` : `<p class="text-sm opacity-60" data-i18n="chat.group.settings.page.groupPerms.noRoles"></p>`}
