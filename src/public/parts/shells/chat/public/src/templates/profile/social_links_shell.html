<div class="flex flex-wrap gap-1">
	${links.length ? links.map(link => `
	<a href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer" class="btn btn-square btn-sm btn-ghost" title="${escapeHtml(link.name || link.url)}">
		${link.icon
		? `<img src="${escapeHtml(link.icon)}" class="h-5 w-5" alt="" aria-hidden="true" svg-inliner-ignore />`
		: '<img src="https://api.iconify.design/line-md/link.svg" class="h-5 w-5" alt="" aria-hidden="true" />'}
	</a>
	`).join('') : '<p class="text-sm opacity-50" data-i18n="chat.profile.noSocialLinks"></p>'}
</div>
