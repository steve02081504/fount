<div class="attachment" id="attachment-${safeName}-${index}" data-template-type="attachment_preview">
	<span class="preview-container"></span>
	<span class="file-name">${file.name}</span>
	${file.description ? `<p class="attachment-transcript text-xs opacity-70 mt-1" user-content>${file.description}</p>` : ''}
	<span class="attachment-button-group ${buttonGroupJoin ? 'join' : ''}">
		${showDownloadButton ? `
		<button type="button" class="download-button btn btn-xs btn-primary ${buttonGroupJoin ? 'join-item' : ''}" data-i18n="chat.attachment.buttons.download" aria-label="Download"><img src="https://api.iconify.design/line-md/download.svg" alt="" aria-hidden="true" data-i18n="chat.attachment.buttons.downloadIcon" /></button>
		` : ''}
		${showSpeechRecognitionButton ? `
		<button type="button" class="speech-recognition-button btn btn-xs btn-ghost ${buttonGroupJoin ? 'join-item' : ''}" data-i18n="chat.attachment.buttons.recognize" aria-label="Recognize speech"><img src="https://api.iconify.design/material-symbols/speech-to-text.svg" alt="" aria-hidden="true" /></button>
		` : ''}
		${showEditButton ? `
		<button type="button" class="attachment-edit-button btn btn-xs btn-ghost ${buttonGroupJoin ? 'join-item' : ''}" data-i18n="chat.attachment.buttons.edit" aria-label="Edit image"><img src="https://api.iconify.design/line-md/edit.svg" alt="" aria-hidden="true" /></button>
		` : ''}
		${showDeleteButton ? `
		<button type="button" class="delete-button btn btn-xs btn-error ${buttonGroupJoin ? 'join-item' : ''}" data-i18n="chat.attachment.buttons.delete" aria-label="Remove attachment"><img src="https://api.iconify.design/line-md/close.svg" alt="" aria-hidden="true" data-i18n="chat.attachment.buttons.deleteIcon" /></button>
		` : ''}
	</span>
</div>
