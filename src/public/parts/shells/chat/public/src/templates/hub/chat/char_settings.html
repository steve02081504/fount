<div class="char-settings-body">
	<div class="card card-border bg-base-100 p-4 space-y-3">
		<h3 class="font-semibold text-sm" data-i18n="chat.hub.session.info"></h3>
		<div class="overlay-info-row"><span data-i18n="chat.hub.session.role"></span><span>${escapeHtml(charname)}</span></div>
		<div class="overlay-info-row"><span data-i18n="chat.hub.session.id"></span><span>${escapeHtml(groupId)}</span></div>
		<div class="overlay-info-row"><span data-i18n="chat.hub.session.messages"></span><span>${logLength}</span></div>
	</div>
	<div class="card card-border bg-base-100 p-4 space-y-3" id="character-chat-config-host"></div>
	<div class="card card-border bg-base-100 p-4 space-y-3">
		<h3 class="font-semibold text-sm" data-i18n="chat.hub.quickActions"></h3>
		<button type="button" class="flex items-center justify-between gap-2 rounded-lg bg-base-200 p-3 cursor-pointer w-full text-left" id="character-chat-advanced">
			<div>
				<div class="font-medium text-sm" data-i18n="chat.hub.advancedSettings"></div>
				<div class="text-xs opacity-60" data-i18n="chat.hub.advancedSettingsDescription"></div>
			</div>
			<span class="text-primary">↗</span>
		</button>
	</div>
	<div class="card card-border bg-base-100 p-4 space-y-3">
		<h3 class="font-semibold text-sm" data-i18n="chat.hub.dangerZone"></h3>
		${friendBound
		? '<div class="text-sm text-base-content/50 mb-2" data-i18n="chat.hub.unbindFriend.description"></div>'
		: '<div class="text-sm text-base-content/50 mb-2" data-i18n="chat.hub.deleteSessionDescription"></div>'}
	</div>
</div>
<div class="char-settings-footer">
	${friendBound
	? '<button type="button" class="btn btn-error btn-outline" id="character-chat-unbind" data-i18n="chat.hub.unbindFriend.main"></button>'
	: '<button type="button" class="btn btn-error btn-outline" id="character-chat-delete" data-i18n="chat.hub.deleteSession"></button>'}
	<button type="button" class="btn btn-ghost" id="character-chat-close" data-i18n="chat.hub.modalClose"></button>
</div>
