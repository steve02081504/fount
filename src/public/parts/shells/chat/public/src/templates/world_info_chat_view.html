<div class="card bg-base-100 shadow-xl mt-2 w-full" data-template-type="world">
	<div class="card-body">
		${avatar
		? `<img src="${escapeHtml(avatar)}" class="w-12 h-12 rounded-box mr-4" alt="" aria-hidden="true" svg-inliner-ignore />`
		: '<img src="https://api.iconify.design/line-md/map-marker-radius.svg" class="w-12 h-12 rounded-box mr-4" alt="" aria-hidden="true" />'}
		<div>
			<h2 class="card-title">${name}</h2>
			<p>${description}</p>
		</div>
	</div>
</div>
