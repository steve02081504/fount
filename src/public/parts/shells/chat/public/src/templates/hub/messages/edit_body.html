<div class="message-edit-box">
	<textarea class="message-edit-textarea" data-i18n="chat.hub.message.edit.area" user-content>${escapeHtml(originalText)}</textarea>
	<div class="message-edit-attach-preview"></div>
	<div class="message-edit-toolbar">
		<button type="button" class="message-edit-upload-button btn btn-ghost btn-xs" data-i18n="chat.hub.message.edit.upload" title="">
			<img src="https://api.iconify.design/mdi/paperclip.svg" class="w-4 h-4" alt="" aria-hidden="true" />
		</button>
		<input type="file" class="message-edit-file-input hidden" multiple />
		<div class="message-edit-toolbar-spacer"></div>
		<button type="button" class="message-edit-cancel btn btn-ghost btn-sm" data-i18n="chat.hub.message.edit.cancel"></button>
		<button type="button" class="${saveClass} btn btn-primary btn-sm" ${saveAttrs} data-i18n="chat.hub.message.edit.save"></button>
	</div>
</div>
<p class="message-edit-hint text-xs opacity-50 mt-1.5" data-i18n="chat.hub.message.edit.hint"></p>
