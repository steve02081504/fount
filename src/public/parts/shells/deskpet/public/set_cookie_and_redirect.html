<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta property="og:title" content="fount Deskpet Setup: Awakening Your Companion" />
	<meta property="og:type" content="website" />
	<meta property="og:description" content="A brief moment of setup to awaken your fount deskpet. Your AI companion is preparing to join you on your desktop." />
	<meta name="description" content="A brief moment of setup to awaken your fount deskpet. Your AI companion is preparing to join you on your desktop." />
	<meta property="og:image" content="/favicon.svg" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Setting up...</title>
</head>

<body>
	<main aria-hidden="true"><!-- Setup page; content is script-driven --></main>
	<script type="module">
		const urlParams = new URLSearchParams(window.location.search)
		const apikey = urlParams.get('apikey')
		const redirect = urlParams.get('redirect')

		if (!apikey || !redirect)
			renderError('Missing parameters')
		else try {
			const secure = location.protocol === 'https:' ? '; Secure' : ''
			document.cookie = `fount-apikey=${encodeURIComponent(apikey)}; path=/; SameSite=Lax${secure}`
			window.location.replace(resolveRedirect(redirect))
		}
		catch (error) {
			renderError(error.message || 'Failed to set cookie')
		}

		/**
		 * 解析 redirect 参数为站内地址，拒绝跨源跳转。
		 * @param {string} value 原始 redirect 参数。
		 * @returns {string} 站内地址。
		 */
		function resolveRedirect(value) {
			const url = new URL(decodeURIComponent(value), window.location.origin)
			if (url.origin !== window.location.origin) throw new Error('Invalid redirect')
			return url.href
		}

		/**
		 * 渲染错误提示。
		 * @param {string} message 错误信息。
		 * @returns {void}
		 */
		function renderError(message) {
			const heading = document.createElement('h1')
			heading.textContent = `Error: ${message}`
			document.body.replaceChildren(heading)
		}
	</script>
</body>

</html>
