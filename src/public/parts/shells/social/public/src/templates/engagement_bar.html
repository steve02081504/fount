<div class="post-actions">
	<button type="button" class="action-btn action-btn-reply replies-btn" data-replies="${actionKey}">
		<span class="sr-only" data-i18n="social.actions.replies"></span>
		<span class="icon icon-reply" aria-hidden="true"></span>
		<span class="action-count">${replyCount}</span>
	</button>
	<button type="button" class="action-btn action-btn-repost repost-btn" data-repost="${actionKey}">
		<span class="sr-only" data-i18n="social.actions.repost"></span>
		<span class="icon icon-repost" aria-hidden="true"></span>
		<span class="action-count">${repostCount}</span>
	</button>
	<button type="button" class="action-btn action-btn-like like-btn${likedClass}" data-like="${actionKey}" data-liked="${likedFlag}" data-i18n="${likeI18n}">
		<span class="icon icon-like" aria-hidden="true"></span>
		<span class="action-count">${likeCount}</span>
	</button>
	<button type="button" class="action-btn action-btn-dislike dislike-btn${dislikedClass}" data-dislike="${actionKey}" data-disliked="${dislikedFlag}" data-i18n="${dislikeI18n}">
		<span class="icon icon-dislike" aria-hidden="true"></span>
		<span class="action-count">${dislikeCount}</span>
	</button>
	<button type="button" class="action-btn action-btn-save" data-save="${actionKey}" data-i18n="social.actions.save">
		<span class="icon icon-bookmark" aria-hidden="true"></span>
	</button>
	<button type="button" class="action-btn action-btn-share" data-share="${actionKey}">
		<span class="sr-only" data-i18n="social.actions.share"></span>
		<span class="icon icon-share" aria-hidden="true"></span>
	</button>
</div>
<div class="repost-panel hidden" data-repost-for="${actionKey}">
	<textarea rows="2" data-i18n="social.repost" user-content></textarea>
	<button type="button" data-submit-repost="${actionKey}"><span data-i18n="social.repost.submit"></span></button>
</div>
