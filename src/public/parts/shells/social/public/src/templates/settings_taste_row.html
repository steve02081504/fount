<article class="taste-row card">
	<div class="taste-row-main">
		<strong class="taste-label">${label}</strong>
		<span class="taste-hash">${tagHashShort}</span>
		<span class="taste-weight" data-i18n="social.settings.taste.weight" data-weight="${weight}"></span>
	</div>
	<form class="taste-rename-form join w-full" data-tag-hash="${tagHash}">
		<input type="text" maxlength="64" class="input input-bordered input-sm join-item flex-1 min-w-0" data-i18n="social.settings.taste.name" value="${labelValue}" />
		<button type="submit" class="btn btn-ghost btn-xs join-item" data-i18n="social.settings.taste.save"></button>
	</form>
</article>
