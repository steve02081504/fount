<article class="explore-account">
	<a href="${profileHref}" class="explore-account-avatar-link" aria-label="${name}" user-content>${avatarHtml}</a>
	<div class="explore-account-body">
		<a href="${profileHref}" class="suggested-account-name">${name}</a>
		<span class="suggested-account-handle">${handle}</span>
		${bioHtml}
	</div>
	<button type="button" class="btn btn-sm btn-primary w-full mt-auto" data-follow="${entityHash}" data-i18n="social.actions.follow"></button>
</article>
