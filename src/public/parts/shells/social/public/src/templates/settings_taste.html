<section class="settings-card card bg-base-200 shadow-sm">
	<div class="card-body gap-2">
		<h3 class="card-title text-base" data-i18n="social.settings.tasteTitle"></h3>
		<p class="settings-hint text-sm opacity-70" data-i18n="social.settings.tasteHint"></p>
		<label class="label cursor-pointer justify-start gap-3">
			<input type="checkbox" id="tastePublishPreferences" class="toggle toggle-sm" ${prefsCheckedAttr} />
			<span data-i18n="social.settings.taste.privacyPublish.preferences"></span>
		</label>
		<p class="settings-hint text-sm opacity-70" data-i18n="social.settings.taste.privacyPublish.preferencesHint"></p>
		<label class="label cursor-pointer justify-start gap-3">
			<input type="checkbox" id="tastePublishReactions" class="toggle toggle-sm" ${reactionsCheckedAttr} />
			<span data-i18n="social.settings.taste.privacyPublish.reactions"></span>
		</label>
		<p class="settings-hint text-sm opacity-70" data-i18n="social.settings.taste.privacyPublish.reactionsHint"></p>
		<button type="button" id="tasteRebuildButton" class="btn btn-primary btn-sm w-fit" data-i18n="social.settings.taste.rebuild"></button>
		<div class="taste-list" data-taste-list></div>
	</div>
</section>
