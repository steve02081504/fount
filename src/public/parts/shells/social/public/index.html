<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta property="og:title" content="The Open Square: fount Social Plaza" />
	<meta property="og:url" content="https://steve02081504.github.io/fount/protocol?url=fount://page/parts/shells:social" />
	<meta property="og:type" content="website" />
	<meta property="og:description" content="Wander peer-to-peer feeds, follows, and shared files beneath fount's social sky. A plaza where distant voices may meet without a central tower." />
	<meta name="description" content="Wander peer-to-peer feeds, follows, and shared files beneath fount's social sky. A plaza where distant voices may meet without a central tower." />
	<meta property="og:image" content="https://repository-images.githubusercontent.com/862251163/0ac90205-ae40-4fc6-af67-1e28d074c76b" />
	<title data-i18n="social.title"></title>
	<link rel="icon" href="/favicon.ico" />
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<script blocking="render" type="module" src="/preload.mjs"></script>
	<link href="https://cdn.jsdelivr.net/npm/daisyui/daisyui.css" rel="stylesheet" type="text/css" crossorigin="anonymous" />
	<link href="/base.css" rel="stylesheet" type="text/css" crossorigin="anonymous" />
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" crossorigin="anonymous"></script>
	<script type="module" src="/base.mjs"></script>
	<link rel="stylesheet" href="/parts/shells:social/styles.css" />
</head>

<body class="bg-base-100 text-base-content min-h-screen">
	<div id="shell" class="shell">
		<nav class="side-nav" data-i18n="social.nav.side">
			<div class="side-nav-brand">
				<p class="brand-title" aria-hidden="true" data-i18n="social.title"></p>
			</div>
			<div class="side-nav-links">
				<button type="button" data-view="feed" class="nav-btn btn btn-ghost justify-start active" data-i18n="social.nav.feed">
					<span class="icon icon-home" aria-hidden="true"></span>
					<span class="nav-label" data-i18n="social.nav.feed.title"></span>
				</button>
				<button type="button" data-view="explore" class="nav-btn btn btn-ghost justify-start" data-i18n="social.nav.explore">
					<span class="icon icon-explore" aria-hidden="true"></span>
					<span class="nav-label" data-i18n="social.nav.explore.title"></span>
				</button>
				<button type="button" data-view="notifications" class="nav-btn btn btn-ghost justify-start" data-i18n="social.nav.notifications">
					<span class="icon icon-bell" aria-hidden="true"></span>
					<span class="nav-label" data-i18n="social.nav.notifications.title"></span>
					<span id="notificationsBadge" class="nav-badge badge badge-primary badge-sm hidden"></span>
				</button>
				<button type="button" data-view="saved" class="nav-btn btn btn-ghost justify-start" data-i18n="social.nav.saved">
					<span class="icon icon-bookmark" aria-hidden="true"></span>
					<span class="nav-label" data-i18n="social.nav.saved.title"></span>
				</button>
				<button type="button" data-view="drafts" class="nav-btn btn btn-ghost justify-start" data-i18n="social.nav.drafts">
					<span class="icon icon-draft" aria-hidden="true"></span>
					<span class="nav-label" data-i18n="social.nav.drafts.title"></span>
				</button>
				<button type="button" data-view="profile" class="nav-btn btn btn-ghost justify-start" data-i18n="social.nav.profile">
					<span class="icon icon-user" aria-hidden="true"></span>
					<span class="nav-label" data-i18n="social.nav.profile.title"></span>
				</button>
				<button type="button" data-view="videos" class="nav-btn btn btn-ghost justify-start" data-i18n="social.nav.videos">
					<span class="icon icon-video" aria-hidden="true"></span>
					<span class="nav-label" data-i18n="social.nav.videos.title"></span>
				</button>
				<button type="button" data-view="live" class="nav-btn btn btn-ghost justify-start" data-i18n="social.nav.live">
					<span class="icon icon-live" aria-hidden="true"></span>
					<span class="nav-label" data-i18n="social.nav.live.title"></span>
				</button>
			</div>
			<button type="button" id="composeNavButton" class="compose-nav-btn btn btn-primary" data-i18n="social.nav.compose">
				<span class="nav-label" data-i18n="social.composer.publish"></span>
				<span class="icon icon-compose compose-nav-icon" aria-hidden="true"></span>
			</button>
		</nav>

		<main class="timeline-col">
			<h1 class="sr-only" data-i18n="social.title"></h1>
			<section id="composer" class="composer">
				<div class="composer-inner">
					<div id="viewerComposerAvatar" class="composer-avatar-slot" aria-hidden="true"></div>
					<div class="composer-body">
						<div id="quotePreview" class="quote-preview hidden"></div>
						<div id="groupRefPreview" class="group-ref-preview hidden"></div>
						<textarea id="postText" rows="3" data-i18n="social.composer" placeholder="" user-content></textarea>
						<input id="postContentWarning" type="text" class="input input-bordered input-sm composer-cw hidden" maxlength="200" data-i18n="social.composer.contentWarning" placeholder="" />
						<div id="pollComposerPanel" class="composer-panel card card-compact bg-base-200 shadow-sm poll-composer hidden">
							<textarea id="pollComposerOptions" rows="3" class="textarea textarea-bordered textarea-sm poll-composer-options" data-i18n="social.poll.options" placeholder=""></textarea>
							<div class="poll-composer-row flex flex-wrap items-center gap-2">
								<label class="label cursor-pointer justify-start gap-2 px-0">
									<input id="pollComposerMulti" type="checkbox" class="checkbox checkbox-sm" />
									<span class="label-text" data-i18n="social.poll.multi"></span>
								</label>
								<label class="flex flex-col gap-0.5 text-xs">
									<span data-i18n="social.poll.deadlineLabel"></span>
									<input id="pollComposerDeadline" type="datetime-local" class="input input-bordered input-sm" />
								</label>
								<button type="button" id="pollComposerApply" class="btn btn-primary btn-xs" data-i18n="social.poll.apply"></button>
							</div>
						</div>
						<div id="mediaPreview" class="media-preview hidden"></div>
						<div id="composerAdvancedPanel" class="composer-panel card card-compact bg-base-200 shadow-sm composer-advanced hidden">
							<label class="composer-field hidden" data-visibility-field>
								<span class="composer-field-label" data-i18n="social.composer.visibility.allowLabel"></span>
								<input data-visibility-allow type="text" class="input input-bordered input-sm" data-i18n="social.composer.visibility.allow" placeholder="" />
							</label>
							<label class="composer-field" data-visibility-field>
								<span class="composer-field-label" data-i18n="social.composer.visibility.exceptLabel"></span>
								<input data-visibility-except type="text" class="input input-bordered input-sm" data-i18n="social.composer.visibility.except" placeholder="" />
							</label>
							<label class="composer-field">
								<span class="composer-field-label" data-i18n="social.composer.reply.policy.label"></span>
								<select id="postReplyPolicy" class="select select-bordered select-sm">
									<option value="everyone" data-i18n="social.composer.reply.policy.everyone"></option>
									<option value="followers_7d" data-i18n="social.composer.reply.policy.followers7d"></option>
									<option value="author_follows" data-i18n="social.composer.reply.policy.authorFollows"></option>
								</select>
							</label>
							<label class="composer-field">
								<span class="composer-field-label" data-i18n="social.composer.reply.displayLabel"></span>
								<select id="postReplyDisplay" class="select select-bordered select-sm">
									<option value="all" data-i18n="social.composer.reply.displayAll"></option>
									<option value="featured_only" data-i18n="social.composer.reply.displayFeaturedOnly"></option>
								</select>
							</label>
							<label class="composer-field">
								<span class="composer-field-label" data-i18n="social.composer.scheduleLabel"></span>
								<input id="postPublishAt" type="datetime-local" class="input input-bordered input-sm" />
							</label>
							<label id="linkGroupField" class="composer-field hidden">
								<span class="composer-field-label" data-i18n="social.groupRef.linking"></span>
								<select id="linkGroupSelect" class="select select-bordered select-sm"></select>
							</label>
							<label id="postAlbumField" class="composer-field hidden">
								<span class="composer-field-label" data-i18n="social.profile.albums.pickerLabel"></span>
								<select id="postAlbumSelect" class="select select-bordered select-sm" multiple size="3"></select>
							</label>
							<label class="label cursor-pointer justify-start gap-2 px-0 composer-advanced-full">
								<input id="postSensitiveMedia" type="checkbox" class="checkbox checkbox-sm" />
								<span class="label-text" data-i18n="social.composer.sensitiveMedia"></span>
							</label>
						</div>
						<div class="composer-toolbar">
							<div class="composer-tools">
								<button id="emojiPickButton" type="button" class="composer-tool-btn btn btn-ghost btn-sm btn-square" data-i18n="social.composer.emojiButton">
									<span class="icon icon-emoji" aria-hidden="true"></span>
								</button>
								<label class="composer-tool-btn btn btn-ghost btn-sm btn-square media-upload-btn">
									<span class="sr-only" data-i18n="social.composer.mediaButton"></span>
									<span class="icon icon-media" aria-hidden="true"></span>
									<input id="mediaInput" type="file" accept="image/*,video/*,audio/*" multiple hidden />
								</label>
								<button id="voiceButton" type="button" class="composer-tool-btn btn btn-ghost btn-sm btn-square" data-i18n="social.composer.voiceButton">
									<span class="icon icon-mic" aria-hidden="true"></span>
								</button>
								<button id="pollComposerToggle" type="button" class="composer-tool-btn btn btn-ghost btn-sm btn-square" data-i18n="social.composer.pollButton">
									<span class="icon icon-vote" aria-hidden="true"></span>
								</button>
								<button id="composerCwToggle" type="button" class="composer-tool-btn btn btn-ghost btn-sm btn-square" data-i18n="social.composer.cwToggle">
									<span class="icon icon-content-warning" aria-hidden="true"></span>
								</button>
								<select id="postVisibility" data-visibility-select class="select select-bordered select-sm composer-visibility rounded-box max-w-40" data-i18n="social.composer.visibility">
									<option value="public" data-i18n="social.composer.visibility.public"></option>
									<option value="unlisted" data-i18n="social.composer.visibility.unlisted"></option>
									<option value="followers" data-i18n="social.composer.visibility.followers"></option>
									<option value="followers_7d" data-i18n="social.composer.visibility.followers7d"></option>
									<option value="followers_30d" data-i18n="social.composer.visibility.followers30d"></option>
									<option value="selected" data-i18n="social.composer.visibility.selected"></option>
									<option value="private" data-i18n="social.composer.visibility.private"></option>
								</select>
								<button id="composerAdvancedToggle" type="button" class="composer-tool-btn btn btn-ghost btn-sm btn-square" data-i18n="social.composer.advancedToggle">
									<span class="icon icon-options" aria-hidden="true"></span>
								</button>
								<input id="postLocale" type="hidden" value="zh-CN" data-i18n="social.composer.locale" />
							</div>
							<button id="saveDraftButton" type="button" class="btn btn-ghost btn-sm" data-i18n="social.composer.saveDraft"></button>
							<button id="postButton" type="button" class="btn btn-primary btn-sm" data-i18n="social.composer.publish"></button>
						</div>
					</div>
				</div>
			</section>

			<section id="feedView" class="view">
				<header class="view-header">
					<h2 class="view-title" data-i18n="social.nav.feed.title"></h2>
					<div class="feed-ranking-tabs tabs tabs-box tabs-xs" role="tablist" data-i18n="social.feed.tabsLabel">
						<button type="button" class="tab tab-active" role="tab" aria-selected="true" data-feed-ranking="latest" data-i18n="social.feed.tabLatest"></button>
						<button type="button" class="tab" role="tab" aria-selected="false" data-feed-ranking="for_you" data-i18n="social.feed.tabForYou"></button>
					</div>
					<button type="button" id="feedSearchOpenButton" class="btn btn-ghost btn-sm btn-square mobile-only-btn" data-i18n="social.search.open">
						<span class="icon icon-search" aria-hidden="true"></span>
					</button>
					<button type="button" id="feedRefreshButton" class="btn btn-ghost btn-sm btn-square tooltip" data-i18n="social.feed.refresh">
						<span class="icon icon-refresh" aria-hidden="true"></span>
					</button>
				</header>
				<div id="feedList" class="feed-list flex flex-col"></div>
			</section>

			<section id="exploreView" class="view hidden">
				<header class="view-header">
					<h2 class="view-title" data-i18n="social.nav.explore.title"></h2>
				</header>
				<div class="explore-shortcuts">
					<button type="button" class="btn btn-ghost btn-sm" data-view="videos" data-i18n="social.nav.videos">
						<span class="icon icon-video" aria-hidden="true"></span>
						<span data-i18n="social.nav.videos.title"></span>
					</button>
					<button type="button" class="btn btn-ghost btn-sm" data-view="live" data-i18n="social.nav.live">
						<span class="icon icon-live" aria-hidden="true"></span>
						<span data-i18n="social.nav.live.title"></span>
					</button>
					<button type="button" class="btn btn-ghost btn-sm" data-view="drafts" data-i18n="social.nav.drafts">
						<span class="icon icon-draft" aria-hidden="true"></span>
						<span data-i18n="social.nav.drafts.title"></span>
					</button>
				</div>
				<div id="exploreTrending" class="feed-trending card bg-base-200 shadow-sm explore-mobile-aside"></div>
				<div id="exploreSuggested" class="aside-suggested card bg-base-200 shadow-sm explore-mobile-aside hidden">
					<h2 class="aside-card-title" data-i18n="social.aside.suggested"></h2>
					<div id="exploreSuggestedList" class="aside-suggested-list"></div>
				</div>
				<section class="explore-section" aria-labelledby="exploreAccountsTitle">
					<div class="explore-section-header">
						<h3 id="exploreAccountsTitle" class="section-title" data-i18n="social.explore.accounts"></h3>
					</div>
					<div id="exploreAccountList" class="explore-account-list"></div>
				</section>
				<section class="explore-section" aria-labelledby="explorePostsTitle">
					<div class="explore-section-header">
						<h3 id="explorePostsTitle" class="section-title" data-i18n="social.explore.posts"></h3>
						<label class="label cursor-pointer justify-start gap-2 text-sm font-semibold">
							<input type="checkbox" id="exploreMediaOnly" class="toggle toggle-xs" />
							<span class="icon icon-media" aria-hidden="true"></span>
							<span data-i18n="social.explore.mediaOnly"></span>
						</label>
					</div>
					<div id="explorePostList" class="explore-post-list flex flex-col"></div>
				</section>
			</section>

			<section id="notificationsView" class="view hidden">
				<header class="view-header">
					<h2 class="view-title" data-i18n="social.nav.notifications.title"></h2>
					<div class="notifications-toolbar hidden" id="notificationsToolbar">
						<button type="button" id="notificationsMarkAllButton" class="view-header-text-btn btn btn-ghost btn-sm" data-i18n="social.notifications.markAllRead"></button>
					</div>
				</header>
				<div class="inbox-filter-tabs tabs tabs-box tabs-xs flex-wrap" role="tablist" data-i18n="social.inbox.filtersLabel">
					<button type="button" class="inbox-filter-tab tab tab-active" role="tab" aria-selected="true" data-notif-filter="all" data-i18n="social.inbox.tabs.all"></button>
					<button type="button" class="inbox-filter-tab tab" role="tab" aria-selected="false" data-notif-filter="mention" data-i18n="social.inbox.tabs.mention"></button>
					<button type="button" class="inbox-filter-tab tab" role="tab" aria-selected="false" data-notif-filter="reply" data-i18n="social.inbox.tabs.reply"></button>
					<button type="button" class="inbox-filter-tab tab" role="tab" aria-selected="false" data-notif-filter="like" data-i18n="social.inbox.tabs.like"></button>
					<button type="button" class="inbox-filter-tab tab" role="tab" aria-selected="false" data-notif-filter="follow" data-i18n="social.inbox.tabs.follow"></button>
					<button type="button" class="inbox-filter-tab tab" role="tab" aria-selected="false" data-notif-filter="repost" data-i18n="social.inbox.tabs.repost"></button>
				</div>
			</section>

			<section id="savedView" class="view hidden">
				<header class="view-header">
					<h2 class="view-title" data-i18n="social.nav.saved.title"></h2>
					<button type="button" id="createFolderButton" class="btn btn-ghost btn-sm btn-square" data-i18n="social.saved.createFolder">
						<span class="icon icon-folder-plus" aria-hidden="true"></span>
					</button>
				</header>
				<div id="savedPanel" class="saved-panel"></div>
			</section>

			<section id="draftsView" class="view hidden">
				<header class="view-header">
					<h2 class="view-title" data-i18n="social.nav.drafts.title"></h2>
				</header>
				<div id="draftsPanel" class="drafts-panel"></div>
			</section>

			<section id="settingsView" class="view hidden">
				<header class="view-header">
					<button type="button" class="btn btn-ghost btn-sm btn-square" data-view="profile" data-i18n="social.settings.back">
						<span class="icon icon-home" aria-hidden="true"></span>
					</button>
					<h2 class="view-title" data-i18n="social.settings.title"></h2>
				</header>
				<div id="settingsPanel" class="settings-panel"></div>
			</section>

			<section id="profileView" class="view hidden"></section>

			<section id="searchView" class="view hidden">
				<header class="view-header">
					<h2 class="view-title" data-i18n="social.search.viewTitle"></h2>
				</header>
				<div class="search-view-filters">
					<div class="feed-search-wrap">
						<span class="icon icon-search search-icon" aria-hidden="true"></span>
						<input type="search" id="searchViewInput" class="feed-search-input input input-bordered input-sm w-full" autocomplete="off" data-i18n="social.search" placeholder="" />
					</div>
					<div class="search-filters">
						<input type="text" id="searchViewAuthor" class="input input-bordered input-sm" data-i18n="social.search.filter.author" placeholder="" />
						<select id="searchViewMedia" class="select select-bordered select-sm" data-i18n="social.search.filter.media">
							<option value="" data-i18n="social.search.filter.mediaAll"></option>
							<option value="image" data-i18n="social.search.filter.mediaImage"></option>
							<option value="video" data-i18n="social.search.filter.mediaVideo"></option>
						</select>
						<input type="text" id="searchViewTag" class="input input-bordered input-sm" data-i18n="social.search.filter.tag" placeholder="" />
						<select id="searchViewSort" class="select select-bordered select-sm" data-i18n="social.search.filter.sort">
							<option value="recent" data-i18n="social.search.sortRecent"></option>
							<option value="popular" data-i18n="social.search.sortPopular"></option>
						</select>
						<select id="searchViewScope" class="select select-bordered select-sm" data-i18n="social.search.filter.scope">
							<option value="local" data-i18n="social.search.scopeLocal"></option>
							<option value="nearby" data-i18n="social.search.scopeNearby"></option>
						</select>
						<button type="button" id="searchViewButton" class="btn btn-primary btn-sm" data-i18n="social.search.submit"></button>
					</div>
				</div>
				<div id="searchViewResults" class="feed-list flex flex-col"></div>
			</section>

			<section id="topicView" class="view hidden">
				<header class="view-header">
					<h2 class="view-title topic-view-title">#</h2>
					<button type="button" id="topicFollowButton" class="btn btn-primary btn-sm" data-i18n="social.topic.follow"></button>
				</header>
				<div id="topicPostList" class="feed-list flex flex-col"></div>
			</section>

			<section id="postDetailView" class="view hidden"></section>

			<section id="liveBroadcastView" class="view hidden">
				<header class="view-header">
					<h2 class="view-title" data-i18n="social.live.broadcast.title"></h2>
				</header>
				<div class="live-broadcast-panel" id="liveBroadcastPanel">
					<input id="liveTitleInput" type="text" class="input input-bordered w-full" maxlength="120" data-i18n="social.live.broadcast.titleInput" />
					<select id="liveMediaMode" class="select select-bordered w-full">
						<option value="av" data-i18n="social.live.broadcast.media.av"></option>
						<option value="audio" data-i18n="social.live.broadcast.media.audio"></option>
						<option value="video" data-i18n="social.live.broadcast.media.video"></option>
						<option value="whip" data-i18n="social.live.broadcast.media.whip"></option>
					</select>
					<div class="live-broadcast-preview">
						<canvas id="liveBroadcastCanvas" class="live-broadcast-canvas" width="640" height="480"></canvas>
						<div id="liveBroadcastVoiceRing" class="live-voice-ring-host hidden"></div>
					</div>
					<div id="liveWhipPanel" class="live-whip-panel hidden">
						<label class="label"><span class="label-text" data-i18n="social.live.broadcast.whipUrl"></span></label>
						<input id="liveWhipUrl" type="text" class="input input-bordered input-sm font-mono w-full" readonly />
						<label class="label"><span class="label-text" data-i18n="social.live.broadcast.whipToken"></span></label>
						<input id="liveWhipToken" type="text" class="input input-bordered input-sm font-mono w-full" readonly />
					</div>
					<button type="button" id="liveStartButton" class="btn btn-error" data-i18n="social.live.broadcast.start"></button>
					<button type="button" id="liveStopButton" class="btn btn-ghost hidden" data-i18n="social.live.broadcast.stop"></button>
					<div class="live-link-row hidden" id="liveLinkRow">
						<input id="liveLinkPeerInput" type="text" class="input input-bordered input-sm flex-1" data-i18n="social.live.link.peer" placeholder="" />
						<button type="button" id="liveLinkInviteButton" class="btn btn-primary btn-sm" data-i18n="social.live.link.invite"></button>
					</div>
					<p id="liveBroadcastStatus" class="live-broadcast-status"></p>
				</div>
			</section>
		</main>

		<section id="videosView" class="view hidden" tabindex="-1" data-i18n="social.video.view">
			<button type="button" class="view-back-btn btn btn-square btn-ghost" id="videosViewBackButton" data-i18n="social.video.back">
				<span class="icon icon-home" aria-hidden="true"></span>
			</button>
			<div class="vertical-snap-view" id="videoSnapContainer"></div>
		</section>

		<section id="liveView" class="view hidden" data-i18n="social.nav.live">
			<div class="live-top-bar">
				<button type="button" class="view-back-btn btn btn-square btn-ghost" id="liveViewBackButton" data-i18n="social.live.back">
					<span class="icon icon-home" aria-hidden="true"></span>
				</button>
				<div id="liveScopeTabs" class="live-scope-tabs" role="tablist">
					<button type="button" data-scope="local" class="live-scope-btn is-active" role="tab" aria-selected="true"></button>
					<button type="button" data-scope="nearby" class="live-scope-btn" role="tab" aria-selected="false"></button>
				</div>
				<button type="button" id="liveGoBroadcastButton" class="live-go-broadcast-btn" data-view-broadcast></button>
			</div>
			<div class="vertical-snap-view" id="liveSnapContainer"></div>
		</section>

		<aside class="aside-col" data-i18n="social.aside.region">
			<div class="aside-search card bg-base-200 shadow-sm">
				<div class="feed-search-wrap">
					<span class="icon icon-search search-icon" aria-hidden="true"></span>
					<input type="search" id="feedSearchInput" class="feed-search-input input input-bordered input-sm w-full" autocomplete="off" data-i18n="social.search" />
					<button type="button" id="feedSearchClearButton" class="search-clear-btn hidden" data-i18n="social.search.clear"></button>
				</div>
			</div>
			<div id="feedTrending" class="feed-trending card bg-base-200 shadow-sm hidden" role="region" aria-labelledby="feedTrendingTitle"></div>
			<div id="asideSuggested" class="aside-suggested card bg-base-200 shadow-sm hidden">
				<h2 class="aside-card-title" data-i18n="social.aside.suggested"></h2>
				<div id="asideSuggestedList" class="aside-suggested-list"></div>
			</div>
		</aside>

		<nav class="mobile-tabbar dock dock-sm" data-i18n="social.nav.mobile">
			<button type="button" data-view="feed" class="nav-btn dock-active" data-i18n="social.nav.feed">
				<span class="icon icon-home" aria-hidden="true"></span>
				<span class="dock-label" data-i18n="social.nav.feed.title"></span>
			</button>
			<button type="button" data-view="explore" class="nav-btn" data-i18n="social.nav.explore">
				<span class="icon icon-explore" aria-hidden="true"></span>
				<span class="dock-label" data-i18n="social.nav.explore.title"></span>
			</button>
			<button type="button" data-view="notifications" class="nav-btn" data-i18n="social.nav.notifications">
				<span class="icon icon-bell" aria-hidden="true"></span>
				<span id="mobileNotificationsBadge" class="nav-badge badge badge-primary badge-xs hidden"></span>
				<span class="dock-label" data-i18n="social.nav.notifications.title"></span>
			</button>
			<button type="button" data-view="saved" class="nav-btn" data-i18n="social.nav.saved">
				<span class="icon icon-bookmark" aria-hidden="true"></span>
				<span class="dock-label" data-i18n="social.nav.saved.title"></span>
			</button>
			<button type="button" data-view="profile" class="nav-btn" data-i18n="social.nav.profile">
				<span class="icon icon-user" aria-hidden="true"></span>
				<span class="dock-label" data-i18n="social.nav.profile.title"></span>
			</button>
		</nav>

		<div class="fab compose-fab-wrap">
			<button type="button" id="composeFab" class="btn btn-primary btn-lg btn-square" data-i18n="social.composer.fab">
				<span class="icon icon-compose" aria-hidden="true"></span>
			</button>
		</div>

		<dialog id="saveModal" class="modal" aria-labelledby="saveModalTitle">
			<div class="modal-box space-y-3">
				<h2 id="saveModalTitle" class="font-bold text-lg" data-i18n="social.saved.pickFolderTitle"></h2>
				<select id="saveFolderSelect" class="select select-bordered w-full" data-i18n="social.saved.folderSelect"></select>
				<div class="modal-action">
					<form method="dialog"><button type="submit" id="saveCancelButton" class="btn" data-i18n="social.saved.cancel"></button></form>
					<button type="button" id="saveConfirmButton" class="btn btn-primary" data-i18n="social.saved.confirm"></button>
				</div>
			</div>
			<form method="dialog" class="modal-backdrop"><button type="submit" data-i18n="social.dialog.close"></button></form>
		</dialog>
	</div>
	<script type="module" src="/parts/shells:social/index.mjs"></script>
</body>

</html>
