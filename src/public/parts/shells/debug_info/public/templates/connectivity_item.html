<tr id="${id || ''}" data-connectivity-key="${id || name}">
	<th scope="row">
		<span class="service-name">
			<img${corsImgAttribute(icon)} src="${icon}" class="text-icon" alt="" />
			<span language-check-ignore>${name}</span>
		</span>
	</th>
	<td><canvas class="latency-sparkline connectivity-status" data-state="${status}" data-latency-key="${id || name}" aria-hidden="true"></canvas></td>
	<td class="latency-value">${status === 'ok' && Number.isFinite(duration) ? duration + 'ms' : '—'}</td>
	<td><span class="status-badge connectivity-status" data-state="${status}" data-i18n="${status === 'ok' ? 'debug_info.normal' : 'debug_info.failed'}"></span></td>
</tr>
