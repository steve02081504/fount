${checks.map(check => `
<tr id="${check.id || ''}" data-connectivity-key="${check.id || check.name}">
	<th scope="row">
		<span class="service-name">
			<img${corsImgAttribute(check.icon)} src="${check.icon}" class="text-icon" alt="" />
			<span language-check-ignore>${check.name}</span>
		</span>
	</th>
	<td><canvas class="latency-sparkline connectivity-status" data-state="${check.status || 'checking'}" data-latency-key="${check.id || check.name}" aria-hidden="true"></canvas></td>
	<td class="latency-value">${check.status === 'ok' && check.duration != null ? check.duration + 'ms' : check.status === 'ok' && check.activeLinks != null ? `<span data-i18n="debug_info.linksCount" data-count="${check.activeLinks}"></span>` : '—'}</td>
	<td><span class="status-badge connectivity-status" data-state="${check.status || 'checking'}" ${check.status === 'ok' ? 'data-i18n="debug_info.normal"' : check.status ? 'data-i18n="debug_info.failed"' : 'data-i18n="debug_info.checking"'}></span></td>
</tr>
`).join('')}
