<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="When shadows gather on the path, peer here for system truth—diagnostics and details to illuminate what went astray. A lantern for those who seek understanding.">
	<meta property="og:title" content="Mirrors for the Curious: fount Debug Info">
	<meta property="og:type" content="website">
	<meta property="og:description" content="When shadows gather on the path, peer here for system truth—diagnostics and details to illuminate what went astray. A lantern for those who seek understanding.">
	<meta property="og:image" content="https://repository-images.githubusercontent.com/862251163/0ac90205-ae40-4fc6-af67-1e28d074c76b" />
	<link rel="icon" href="/favicon.ico" />
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<link rel="manifest" href="/manifest.json" />
	<title data-i18n="debug_info.title"></title>
	<script blocking="render" type="module" src="/preload.mjs"></script>
	<link href="https://cdn.jsdelivr.net/npm/daisyui/daisyui.css" rel="stylesheet" type="text/css" crossorigin="anonymous" />
	<link href="/base.css" rel="stylesheet" type="text/css" crossorigin="anonymous" />
	<link href="./index.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" crossorigin="anonymous"></script>
	<script type="module" src="/base.mjs"></script>
</head>

<body class="debug-info-page bg-base-200 min-h-screen">
	<main class="debug-info-main">
		<header class="debug-info-header">
			<div class="header-copy">
				<div class="header-title-row">
					<h1 data-i18n="debug_info.heading"></h1>
					<span class="page-status">
						<span class="status-dot" aria-hidden="true"></span>
						<span language-check-ignore>fount</span>
						<span data-i18n="debug_info.normal"></span>
					</span>
				</div>
			</div>
			<button id="copy-button" class="btn btn-success copy-button">
				<img src="https://api.iconify.design/line-md/clipboard.svg" class="text-icon" alt="" />
				<span data-i18n="debug_info.copyButton"></span>
			</button>
		</header>

		<section class="debug-info-panel version-panel" aria-labelledby="version-heading">
			<div class="version-heading">
				<h2 id="version-heading" data-i18n="debug_info.versionStatus.title"></h2>
				<div id="version-indicator" class="status-badge" data-state="checking" data-i18n="debug_info.versionStatus.checking"></div>
			</div>
			<div class="version-details">
				<div class="version-value"><span data-i18n="debug_info.versionStatus.local"></span><code id="local-version">...</code></div>
				<div class="version-value"><span data-i18n="debug_info.versionStatus.remote"></span><code id="remote-version">...</code></div>
			</div>
			<button id="update-button" class="btn btn-sm update-button" disabled>
				<img id="update-button-icon" src="https://api.iconify.design/line-md/backup-restore.svg" class="text-icon" alt="" />
				<span id="update-button-label" data-i18n="debug_info.update.now"></span>
			</button>
		</section>

		<section class="debug-info-panel system-panel" aria-labelledby="system-heading">
			<div class="system-overview">
				<h2 id="system-heading" data-i18n="debug_info.systemInfo.title"></h2>
				<div id="memory-summary" class="memory-summary" aria-live="polite">
					<span data-i18n="debug_info.memoryUsage"></span>
					<strong id="memory-percent">--%</strong>
					<progress id="memory-progress" class="progress progress-success" max="100" value="0"></progress>
				</div>
			</div>
			<div class="table-scroll system-table-wrap">
				<table class="debug-info-table">
					<tbody id="system-info-table">
						<tr><td colspan="2" class="loading-cell" data-i18n="debug_info.loading"></td></tr>
					</tbody>
				</table>
			</div>
		</section>

		<section id="test-status-card" class="debug-info-panel hidden" aria-labelledby="test-status-heading">
			<button id="test-status-toggle" type="button" class="panel-toggle" aria-expanded="false">
				<span id="test-status-heading" class="panel-title" data-i18n="debug_info.testStatus.title"></span>
				<span class="test-status-meta">
					<span id="test-status-badge" class="status-badge" data-state="idle"></span>
					<img id="test-status-chevron" class="text-icon panel-chevron" src="https://api.iconify.design/line-md/chevron-small-down.svg" alt="" />
				</span>
			</button>
			<ul id="test-status-list" class="test-status-list hidden"></ul>
		</section>

		<section class="connectivity-grid">
			<div class="debug-info-panel connectivity-panel">
				<div class="panel-heading">
					<h2 data-i18n="debug_info.connectivity.backend"></h2>
					<img src="https://api.iconify.design/line-md/cloud.svg" class="text-icon" alt="" />
				</div>
				<div class="table-scroll">
					<table class="debug-info-table connectivity-table">
						<tbody id="backend-checks"><tr><td data-i18n="debug_info.checking"></td></tr></tbody>
					</table>
				</div>
			</div>
			<div class="debug-info-panel connectivity-panel">
				<div class="panel-heading">
					<h2 data-i18n="debug_info.connectivity.frontend"></h2>
					<img src="https://api.iconify.design/line-md/computer.svg" class="text-icon" alt="" />
				</div>
				<div class="table-scroll">
					<table class="debug-info-table connectivity-table">
						<tbody id="frontend-checks"><tr><td data-i18n="debug_info.checking"></td></tr></tbody>
					</table>
				</div>
			</div>
		</section>

		<section class="debug-info-panel log-panel" aria-labelledby="logs-heading">
			<div class="panel-heading">
				<h2 id="logs-heading" data-i18n="debug_info.realtimeLogs"></h2>
				<img src="https://api.iconify.design/line-md/document-code.svg" class="text-icon" alt="" />
			</div>
			<iframe src="/log_viewer/?embedded=debug-info" class="debug-log-frame" title="log viewer" loading="lazy"></iframe>
		</section>
	</main>

	<script type="module" src="./index.mjs"></script>
</body>

</html>
