<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Gist 文档库：保存、查看、编辑与分享 Markdown 文档，按 gist 设置安全等级。" />
	<meta property="og:title" content="Gist: Markdown Docs in fount" />
	<meta property="og:url" content="https://steve02081504.github.io/fount/protocol?url=fount://page/parts/shells:gist/" />
	<meta property="og:type" content="website" />
	<meta property="og:description" content="A Markdown document library: save, view, edit and share gists with per-gist security levels." />
	<meta property="og:image" content="https://repository-images.githubusercontent.com/862251163/0ac90205-ae40-4fc6-af67-1e28d074c76b" />
	<title data-i18n="gist.title"></title>
	<link rel="icon" href="/favicon.ico" />
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
	<link rel="manifest" href="/manifest.json" />
	<script blocking="render" type="module" src="/preload.mjs"></script>
	<link href="https://cdn.jsdelivr.net/npm/daisyui/daisyui.css" rel="stylesheet" type="text/css" />
	<link href="/base.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" crossorigin="anonymous"></script>
	<script type="module" src="/base.mjs"></script>
	<link rel="stylesheet" href="../index.css" />
</head>
<body>
	<div class="gist-page flex h-dvh w-full flex-col bg-base-100 text-base-content">
		<header class="gist-topbar flex items-center gap-1.5 px-2 py-1.5 border-b border-base-content/10 flex-wrap">
			<h1 class="sr-only" data-i18n="gist.title"></h1>
			<button class="btn btn-ghost btn-sm" id="back-button" type="button" data-i18n="gist.view.back"></button>
			<span class="gist-view-title flex-1 min-w-0 truncate font-semibold" id="view-title" user-content></span>
			<div class="flex items-center gap-1.5" id="gist-actions">
				<button class="btn btn-sm gist-badge" id="security-toggle" type="button" data-i18n="gist.securityToggle.secure"></button>
				<button class="btn btn-ghost btn-sm" id="edit-button" type="button" data-i18n="gist.view.edit"></button>
				<button class="btn btn-ghost btn-sm" id="download-button" type="button" data-i18n="gist.view.download"></button>
				<button class="btn btn-ghost btn-sm" id="share-button" type="button" data-i18n="gist.view.share"></button>
				<button class="btn btn-ghost btn-sm" id="delete-button" type="button" data-i18n="gist.view.delete"></button>
			</div>
		</header>
		<main class="gist-main flex-1 overflow-y-auto" id="gist-scroll">
			<div class="gist-view-body markdown-body" id="content" data-gist-drop-zone user-content></div>
			<div id="source-plugins"></div>
		</main>
		<div class="gist-not-found" id="not-found" hidden>
			<div data-i18n="gist.view.notFound"></div>
			<a class="btn btn-primary btn-sm" href="/parts/shells:gist/" data-i18n="gist.view.back"></a>
		</div>
	</div>
	<script type="module" src="../view.mjs"></script>
</body>
</html>
