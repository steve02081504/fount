<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta property="og:title" content="Whispers of Creation: Shaping fount's AI Oracles" />
	<meta property="og:url" content="https://steve02081504.github.io/fount/protocol?url=fount://page/parts/shells:serviceSourceManage/" />
	<meta property="og:type" content="website" />
	<meta property="og:description" content="Here, you conduct the symphony of AI voices. Add, sculpt, or silence the sources that give life to your fount companions—a delicate dance of code and imagination." />
	<meta name="description" content="Here, you conduct the symphony of AI voices. Add, sculpt, or silence the sources that give life to your fount companions—a delicate dance of code and imagination." />
	<meta property="og:image" content="https://repository-images.githubusercontent.com/862251163/0ac90205-ae40-4fc6-af67-1e28d074c76b" />
	<title data-i18n="serviceSource_manager.title"></title>
	<link rel="icon" href="/favicon.ico" />
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<link rel="manifest" href="/manifest.json" />
	<script blocking="render" type="module" src="/preload.mjs"></script>
	<link href="https://cdn.jsdelivr.net/npm/daisyui/daisyui.css" rel="stylesheet" type="text/css" crossorigin="anonymous" />
	<link href="/base.css" rel="stylesheet" type="text/css" crossorigin="anonymous" />
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" crossorigin="anonymous"></script>
	<script type="module" src="/base.mjs"></script>
	<link rel="stylesheet" href="./index.css" type="text/css" />
</head>

<body>
	<main class="container mx-auto p-4 max-w-7xl">
		<header class="mb-6">
			<h1 class="text-3xl font-bold flex items-center gap-2" data-i18n="serviceSource_manager.title"></h1>
		</header>

		<div class="grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">
			<!-- 文件列表区域 -->
			<div class="lg:col-span-1 card bg-base-200 shadow-xl">
				<div class="card-body p-4 gap-3">
					<div class="flex justify-between items-center">
						<h2 class="card-title text-lg" data-i18n="serviceSource_manager.fileList.title"></h2>
						<button id="addFileButton" type="button" class="btn btn-sm btn-square btn-primary" data-i18n="serviceSource_manager.fileList.addButton">
							<img src="https://api.iconify.design/line-md/plus.svg" class="text-icon w-5 h-5" alt="" aria-hidden="true" />
						</button>
					</div>
					<div id="fileList" class="file-list flex flex-col gap-1 max-h-[50vh] lg:max-h-[70vh] overflow-y-auto">
						<!-- 文件列表项将会动态生成 -->
					</div>
					<p id="emptyFileList" class="text-center text-sm opacity-60 py-8 hidden" data-i18n="serviceSource_manager.fileList.empty"></p>
				</div>
			</div>

			<!-- 编辑区域 -->
			<section class="lg:col-span-3 card bg-base-200 shadow-xl">
				<div class="card-body gap-4">
					<h2 class="card-title text-xl" data-i18n="serviceSource_manager.configTitle"></h2>

					<div class="alert alert-soft alert-info text-sm items-start">
						<img src="https://api.iconify.design/line-md/alert-circle.svg" class="text-icon h-6 w-6 flex-shrink-0" alt="" aria-hidden="true" />
						<div>
							<span data-i18n="serviceSource_manager.needsConfigReminder"></span>
							<br>
							<a class="link link-primary" href="/parts/shells:config/" data-i18n="serviceSource_manager.needsConfigLink"></a>
						</div>
					</div>

					<div id="modelRankHint" class="hidden">
						<a href="https://steve02081504.github.io/model-number-rank/" target="_blank" rel="noopener noreferrer" class="link link-primary inline-flex items-center gap-1 text-sm">
							<img src="https://api.iconify.design/line-md/external-link.svg" class="text-icon h-4 w-4" alt="" aria-hidden="true" />
							<span data-i18n="serviceSource_manager.modelRankHint"></span>
						</a>
					</div>

					<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
						<label class="form-control w-full" for="generatorSubtypeSelect">
							<span class="label-text mb-1" data-i18n="serviceSource_manager.subtypeSelect.label"></span>
							<select id="generatorSubtypeSelect" class="select select-bordered w-full">
								<option disabled selected data-i18n="serviceSource_manager.subtypeSelect.placeholder"></option>
							</select>
						</label>
						<label class="form-control w-full" for="generatorSelect">
							<span class="label-text mb-1" data-i18n="serviceSource_manager.generatorSelect.label"></span>
							<select id="generatorSelect" class="select select-bordered w-full">
								<option disabled selected data-i18n="serviceSource_manager.generatorSelect.placeholder"></option>
							</select>
						</label>
					</div>

					<div id="generatorDisplay"></div>

					<!-- JSON 编辑器容器 -->
					<div id="jsonEditor" class="jsoneditor-container relative h-[420px] lg:h-[520px] overflow-auto rounded-box">
						<div id="disabledIndicator" class="absolute inset-0 z-10 bg-base-200/80 backdrop-blur-sm flex justify-center items-center rounded-box hidden">
							<span class="text-lg text-error" data-i18n="serviceSource_manager.editor.disabledIndicator"></span>
						</div>
					</div>

					<div class="card-actions justify-end items-center gap-2 mt-1">
						<button id="deleteButton" type="button" class="btn btn-outline btn-error">
							<img src="https://api.iconify.design/line-md/trash.svg" class="text-icon w-5 h-5" alt="" aria-hidden="true" />
							<span data-i18n="serviceSource_manager.buttons.delete"></span>
						</button>
						<button id="saveButton" type="button" class="btn btn-primary">
							<img id="saveStatusIcon" src="" class="w-6 h-6 hidden" alt="" aria-hidden="true" />
							<span id="saveStatusText" data-i18n="serviceSource_manager.buttons.save"></span>
						</button>
					</div>
				</div>
			</section>
		</div>
	</main>

	<script type="module" src="./index.mjs"></script>
</body>

</html>
