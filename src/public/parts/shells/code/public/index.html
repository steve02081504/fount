<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="AI coding sessions with workspace and machine targeting." />
	<meta property="og:title" content="Code: AI Coding Workspaces in fount" />
	<meta property="og:url" content="https://steve02081504.github.io/fount/protocol?url=fount://page/parts/shells:code/" />
	<meta property="og:type" content="website" />
	<meta property="og:description" content="An opencode-style AI coding workspace: chat with any character over your projects, run code and edit files on the local machine or connected subfounts." />
	<meta property="og:image" content="https://repository-images.githubusercontent.com/862251163/0ac90205-ae40-4fc6-af67-1e28d074c76b" />
	<title data-i18n="code.title"></title>
	<link rel="icon" href="/favicon.ico" />
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
	<link rel="manifest" href="/manifest.json" />
	<script blocking="render" type="module" src="/preload.mjs"></script>
	<link href="https://cdn.jsdelivr.net/npm/daisyui/daisyui.css" rel="stylesheet" type="text/css" />
	<link href="/base.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" crossorigin="anonymous"></script>
	<script type="module" src="/base.mjs"></script>
	<link rel="stylesheet" href="./index.css" />
</head>
<body>
	<div class="code-layout">
		<main class="code-main">
			<h1 class="sr-only" data-i18n="code.title"></h1>
			<header class="code-topbar">
				<div class="code-topbar-left">
					<div class="dropdown" id="session-select-wrap">
						<button class="code-pill code-pill-primary" id="session-select" role="button" tabindex="0">
							<span class="code-pill-label" id="session-select-label" user-content></span>
							<span class="code-pill-chevron" aria-hidden="true">▾</span>
						</button>
						<ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-50 w-80 p-2 shadow" id="session-select-menu"></ul>
					</div>
					<button class="btn btn-sm btn-primary" id="new-session-button" data-i18n="code.sessions.new"></button>
				</div>
				<div class="code-session-title" id="session-title" user-content></div>
				<div class="code-topbar-right">
					<div class="dropdown dropdown-end" id="workspace-overview-wrap">
						<button class="code-pill" id="workspace-overview-pill" role="button" tabindex="0">
							<span class="code-pill-label" id="workspace-overview-label" user-content></span>
							<span class="code-pill-chevron" aria-hidden="true">▾</span>
						</button>
						<ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-50 w-80 p-2 shadow" id="workspace-overview-menu"></ul>
					</div>
				</div>
			</header>
			<div class="code-messages" id="messages"></div>
			<div class="code-composer">
				<div class="code-composer-shell">
					<div id="composer-input" class="code-composer-input" data-markdown-rich-input data-i18n="code.composer" user-content></div>
					<div class="code-composer-controls">
						<div class="code-composer-controls-main">
							<div class="dropdown dropdown-top" id="mode-pill-wrap">
								<button class="code-pill" id="mode-pill" role="button" tabindex="0">
									<span class="code-pill-label" id="mode-pill-label"></span>
									<span class="code-pill-chevron" aria-hidden="true">▾</span>
								</button>
								<ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-50 w-48 p-2 shadow" id="mode-menu"></ul>
							</div>
							<div class="dropdown dropdown-top" id="ai-source-pill-wrap">
								<button class="code-pill" id="ai-source-pill" role="button" tabindex="0">
									<span class="code-pill-label" id="ai-source-pill-label"></span>
									<span class="code-pill-chevron" aria-hidden="true">▾</span>
								</button>
								<ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-50 w-64 p-2 shadow" id="ai-source-menu"></ul>
							</div>
							<div class="dropdown dropdown-top hidden" id="shell-pill-wrap">
								<button class="code-pill" id="shell-pill" role="button" tabindex="0">
									<span class="code-pill-label" id="shell-pill-label"></span>
									<span class="code-pill-chevron" aria-hidden="true">▾</span>
								</button>
								<ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-50 w-48 p-2 shadow" id="shell-menu"></ul>
							</div>
						</div>
						<button class="code-composer-send" id="send-button" data-i18n="code.composer.sendButton">
							<svg id="send-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M12 19V5"></path>
								<path d="M5 12l7-7 7 7"></path>
							</svg>
						</button>
					</div>
				</div>
				<div class="code-composer-hint" id="composer-hint" data-i18n="code.composer.hint"></div>
				<div class="code-composer-targets">
					<div class="dropdown dropdown-top" id="workspace-pill-wrap">
						<button class="code-pill" id="workspace-pill" role="button" tabindex="0">
							<span class="code-pill-label" id="workspace-pill-label"></span>
							<span class="code-pill-chevron" aria-hidden="true">▾</span>
						</button>
						<ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-50 w-64 p-2 shadow" id="workspace-menu"></ul>
					</div>
					<div class="dropdown dropdown-top" id="machine-pill-wrap">
						<button class="code-pill" id="machine-pill" role="button" tabindex="0">
							<span class="code-pill-label" id="machine-pill-label"></span>
							<span class="code-pill-chevron" aria-hidden="true">▾</span>
						</button>
						<ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-50 w-64 p-2 shadow" id="machine-menu"></ul>
					</div>
					<div class="dropdown dropdown-top" id="char-pill-wrap">
						<button class="code-pill" id="char-pill" role="button" tabindex="0">
							<span class="code-pill-label" id="char-pill-label"></span>
							<span class="code-pill-chevron" aria-hidden="true">▾</span>
						</button>
						<ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-50 w-64 p-2 shadow" id="char-menu">
							<li id="char-switch-item"><button id="char-switch-button" data-i18n="code.char.switch"></button></li>
							<li><a id="char-settings-link" data-i18n="code.char.settings" href="#"></a></li>
							<li><a data-i18n="code.char.goodAgent" href="https://steve02081504.github.io/fount/blog/" target="_blank" rel="noopener"></a></li>
						</ul>
					</div>
				</div>
			</div>
		</main>
	</div>
	<script type="module" src="./index.mjs"></script>
</body>
</html>
