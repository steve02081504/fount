<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="AI coding sessions with workspace and machine targeting." />
	<meta property="og:title" content="Code: AI Coding Workspaces in fount" />
	<meta property="og:url" content="https://steve02081504.github.io/fount/protocol?url=fount://page/parts/shells:code/" />
	<meta property="og:type" content="website" />
	<meta property="og:description" content="An opencode-style AI coding workspace: chat with any character over your projects, run code and edit files on the local machine or connected subfounts." />
	<meta property="og:image" content="https://repository-images.githubusercontent.com/862251163/0ac90205-ae40-4fc6-af67-1e28d074c76b" />
	<title data-i18n="code.title"></title>
	<link rel="icon" href="/favicon.ico" />
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
	<link rel="manifest" href="/manifest.json" />
	<script blocking="render" type="module" src="/preload.mjs"></script>
	<link href="https://cdn.jsdelivr.net/npm/daisyui/daisyui.css" rel="stylesheet" type="text/css" />
	<link href="/base.css" rel="stylesheet" type="text/css" />
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" crossorigin="anonymous"></script>
	<script type="module" src="/base.mjs"></script>
	<link rel="stylesheet" href="./index.css" />
</head>
<body class="h-dvh w-screen overflow-hidden">
	<div class="code-layout">
		<aside class="code-sessions" id="sessions-panel">
			<div class="code-sessions-head">
				<button class="btn btn-sm btn-primary w-full" id="new-session-button" data-i18n="code.sessions.new"></button>
			</div>
			<div class="code-sessions-list" id="sessions-list"></div>
		</aside>
		<main class="code-main">
			<h1 class="sr-only" data-i18n="code.title"></h1>
			<header class="code-topbar">
				<select class="select select-sm" id="machine-select" data-i18n="code.machine"></select>
				<select class="select select-sm" id="workspace-select" data-i18n="code.workspaces"></select>
				<div class="dropdown" id="workspace-menu-wrap">
					<button class="btn btn-sm" id="workspace-manage-button" data-i18n="code.workspaces.manage"></button>
					<div class="dropdown-content menu bg-base-200 rounded-box z-50 w-56 p-2 shadow" id="workspace-menu">
						<button class="menu-item" id="workspace-browse-button" data-i18n="code.workspaces.browse"></button>
						<button class="menu-item text-error" id="workspace-remove-button" data-i18n="code.workspaces.remove"></button>
					</div>
				</div>
				<div class="flex-1"></div>
				<div class="dropdown dropdown-end">
					<div tabindex="0" role="button" class="btn btn-sm" id="char-menu-button">…</div>
					<ul tabindex="0" class="dropdown-content menu bg-base-200 rounded-box z-50 w-64 p-2 shadow">
						<li id="char-switch-item"><button id="char-switch-button" data-i18n="code.char.switch"></button></li>
						<li><a id="char-settings-link" data-i18n="code.char.settings" href="#"></a></li>
						<li><a data-i18n="code.char.goodAgent" href="https://steve02081504.github.io/fount/blog/" target="_blank" rel="noopener"></a></li>
					</ul>
				</div>
			</header>
			<div class="code-messages" id="messages"></div>
			<div class="code-composer">
				<div class="code-composer-shell">
					<div id="composer-input" class="code-composer-input" data-markdown-rich-input data-i18n="code.composer" user-content></div>
					<div class="code-composer-controls">
						<label class="code-control">
							<span data-i18n="code.composer.mode"></span>
							<select class="select select-xs" id="mode-select"></select>
						</label>
						<label class="code-control">
							<span data-i18n="code.composer.aiSource"></span>
							<select class="select select-xs" id="ai-source-select"></select>
						</label>
						<label class="code-control hidden" id="shell-mode-control">
							<span data-i18n="code.composer.shell"></span>
							<select class="select select-xs" id="shell-select"></select>
						</label>
						<div class="flex-1"></div>
						<button class="btn btn-sm btn-primary" id="send-button" data-i18n="code.composer.send"></button>
					</div>
				</div>
				<div class="code-composer-hint" id="composer-hint" data-i18n="code.composer.hint"></div>
			</div>
		</main>
	</div>
	<dialog class="modal" id="ai-source-panel">
		<div class="modal-box">
			<h2 class="text-lg font-bold" data-i18n="code.aiSource.panelTitle"></h2>
			<div id="ai-source-list" class="py-2"></div>
			<div class="modal-action">
				<a class="btn btn-sm" href="/parts/shells:serviceSourceManage/" target="_blank" rel="noopener" data-i18n="code.aiSource.manage"></a>
				<form method="dialog"><button class="btn btn-sm" data-i18n="util.common.close"></button></form>
			</div>
		</div>
		<form method="dialog" class="modal-backdrop"><button>close</button></form>
	</dialog>
	<dialog class="modal" id="folder-browser">
		<div class="modal-box w-11/12 max-w-2xl">
			<h2 class="text-lg font-bold" data-i18n="code.workspaces.browse"></h2>
			<div class="py-2 flex items-center gap-2">
				<input class="input input-sm flex-1" id="folder-path-input" user-content />
				<button class="btn btn-sm" id="folder-go-button" data-i18n="code.workspaces.go"></button>
			</div>
			<div id="folder-entries" class="border border-base-300 rounded-box h-72 overflow-auto py-1"></div>
			<div class="modal-action">
				<form method="dialog"><button class="btn btn-sm" data-i18n="util.common.cancel"></button></form>
				<button class="btn btn-sm btn-primary" id="folder-select-button" data-i18n="code.workspaces.select"></button>
			</div>
		</div>
		<form method="dialog" class="modal-backdrop"><button>close</button></form>
	</dialog>
	<dialog class="modal" id="command-params">
		<div class="modal-box">
			<h2 class="text-lg font-bold" id="command-params-title"></h2>
			<div id="command-params-fields" class="py-2"></div>
			<div class="modal-action">
				<form method="dialog"><button class="btn btn-sm" data-i18n="util.common.cancel"></button></form>
				<button class="btn btn-sm btn-primary" id="command-params-run" data-i18n="code.commands.run"></button>
			</div>
		</div>
		<form method="dialog" class="modal-backdrop"><button>close</button></form>
	</dialog>
	<dialog class="modal" id="char-switch-dialog">
		<div class="modal-box">
			<h2 class="text-lg font-bold" data-i18n="code.char.switch"></h2>
			<div id="char-switch-list" class="py-2 max-h-96 overflow-auto"></div>
			<div class="modal-action">
				<form method="dialog"><button class="btn btn-sm" data-i18n="util.common.close"></button></form>
			</div>
		</div>
		<form method="dialog" class="modal-backdrop"><button>close</button></form>
	</dialog>
	<script type="module" src="./index.mjs"></script>
</body>
</html>
